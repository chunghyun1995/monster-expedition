<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14161f">
<meta name="description" content="오리지널 몬스터를 모으고 키우는 2화면 턴제 RPG — 브라우저에서 바로 플레이">
<title>몬스터 원정대</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
*{box-sizing:border-box}
:root{--u:2px;--ink:#2b2f45;--line:#4b5574;--hi:#ffcf3a}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;height:100%;background:#14161f;color:#eef0f7;font-family:'Galmuri11','Galmuri9',ui-monospace,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 0%,#2a2f45 0%,#14161f 70%)}
#app{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:100dvh;padding:8px}
#ds{display:flex;flex-direction:column;align-items:center;padding:calc(var(--u)*5);border-radius:calc(var(--u)*10);background:linear-gradient(#3a3f55,#262a3b);box-shadow:0 calc(var(--u)*4) calc(var(--u)*18) rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12)}
#ds.wide{flex-direction:row;align-items:center}
.bezel{padding:calc(var(--u)*3);border-radius:calc(var(--u)*5);background:#11131b;box-shadow:inset 0 0 0 1px #000,0 1px 0 rgba(255,255,255,.08)}
#hinge{display:flex;gap:calc(var(--u)*40);justify-content:center;align-items:center;height:calc(var(--u)*9);width:100%}
#hinge i{display:block;width:calc(var(--u)*30);height:calc(var(--u)*3);border-radius:9px;background:#1b1e2b;box-shadow:inset 0 1px 1px rgba(0,0,0,.6)}
#ds.wide #hinge{flex-direction:column;height:auto;width:calc(var(--u)*9);gap:calc(var(--u)*30)}
#ds.wide #hinge i{width:calc(var(--u)*3);height:calc(var(--u)*24)}
.scr{position:relative;width:calc(var(--u)*256);height:calc(var(--u)*192);overflow:hidden;background:#000;border-radius:calc(var(--u)*1.5)}
.scr canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.ov{position:absolute;inset:0;font-size:calc(var(--u)*10);line-height:1.45;color:var(--ink);pointer-events:none}
.ov>*{pointer-events:auto}
.fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .28s}
.fade.white{background:#fff}
.abs{position:absolute}
.hidden{display:none!important}
.nop{pointer-events:none!important}

/* ---------- 대화창 ---------- */
#dlg{position:absolute;left:calc(var(--u)*3);right:calc(var(--u)*3);bottom:calc(var(--u)*3);height:calc(var(--u)*46);padding:calc(var(--u)*6) calc(var(--u)*10);font-size:calc(var(--u)*11);line-height:calc(var(--u)*16);white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;background:#fdfdf8;border-radius:calc(var(--u)*5);border:calc(var(--u)*2) solid #5a6488;box-shadow:inset 0 0 0 calc(var(--u)*1.5) #fff,inset 0 0 0 calc(var(--u)*2.5) #c8cde0,0 calc(var(--u)*1.5) 0 rgba(0,0,0,.35);z-index:30;cursor:pointer}
#dlg .tx{display:block;overflow:hidden;max-height:calc(var(--u)*32)}
#dlg .nx{position:absolute;right:calc(var(--u)*8);bottom:calc(var(--u)*4);width:0;height:0;border-left:calc(var(--u)*4) solid transparent;border-right:calc(var(--u)*4) solid transparent;border-top:calc(var(--u)*5) solid #e2566f;animation:bob .45s infinite alternate}
#dlg .tag{position:absolute;left:calc(var(--u)*8);top:calc(var(--u)*-13);padding:0 calc(var(--u)*7);height:calc(var(--u)*13);font-size:calc(var(--u)*9);line-height:calc(var(--u)*13);background:#5a6488;color:#fff;border-radius:calc(var(--u)*4) calc(var(--u)*4) 0 0}
@keyframes bob{to{transform:translateY(calc(var(--u)*2))}}

/* ---------- 공통 상자 / 버튼 ---------- */
.box{position:absolute;background:#fdfdf8;border-radius:calc(var(--u)*5);border:calc(var(--u)*2) solid #5a6488;box-shadow:inset 0 0 0 calc(var(--u)*1.5) #fff,inset 0 0 0 calc(var(--u)*2.5) #c8cde0,0 calc(var(--u)*1.5) 0 rgba(0,0,0,.3)}
.btn{position:absolute;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:calc(var(--u)*1);border-radius:calc(var(--u)*7);background:linear-gradient(#ffffff,#dfe3ee);border:calc(var(--u)*1.5) solid var(--line);color:var(--ink);box-shadow:inset 0 calc(var(--u)*-3) 0 rgba(30,40,80,.12),0 calc(var(--u)*2) 0 rgba(0,0,0,.4);cursor:pointer;transition:transform .05s;line-height:1.25;overflow:hidden}
.btn.sel{box-shadow:0 0 0 calc(var(--u)*1.5) #fff,0 0 0 calc(var(--u)*3) var(--hi),inset 0 calc(var(--u)*-3) 0 rgba(30,40,80,.12),0 calc(var(--u)*3) 0 rgba(0,0,0,.35);z-index:2}
.btn.dis{filter:grayscale(.9) brightness(.85);opacity:.6;cursor:default}
.btn.press{transform:translateY(calc(var(--u)*1.5))}
.btn small{font-size:calc(var(--u)*8);opacity:.75}
.btn.dark{background:linear-gradient(#4b5574,#2f3650);color:#fff;border-color:#1e2235}
.btn.red{background:linear-gradient(#ff8a8a,#e04a5a);color:#fff;border-color:#8a1f2e;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.purple{background:linear-gradient(#c8a8ff,#7a4ad8);color:#fff;border-color:#3d2280;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.blue{background:linear-gradient(#8ec5ff,#3d7ad6);color:#fff;border-color:#1f3f7a;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.green{background:linear-gradient(#a6ec8a,#4caf50);color:#fff;border-color:#24632a;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.yellow{background:linear-gradient(#ffe58a,#f0b429);color:#4a3200;border-color:#8a6100}
.btn.ghost{background:rgba(255,255,255,.85)}
.btn img{image-rendering:pixelated}
.btn.left{justify-content:flex-start;flex-direction:row;text-align:left;padding:0 calc(var(--u)*6)}
.bigbtn{font-size:calc(var(--u)*15)}
.backdrop{position:absolute;inset:0}

/* ---------- 리스트 ---------- */
.lst{position:absolute;overflow:hidden;border-radius:calc(var(--u)*5);background:#fdfdf8;border:calc(var(--u)*2) solid #5a6488;box-shadow:0 calc(var(--u)*1.5) 0 rgba(0,0,0,.3)}
.lst .in{position:absolute;left:0;right:0;top:0;transition:transform .08s}
.row{position:relative;display:flex;align-items:center;gap:calc(var(--u)*4);padding:0 calc(var(--u)*6) 0 calc(var(--u)*12);white-space:nowrap;cursor:pointer;border-bottom:1px solid #eceef5}
.row:nth-child(even){background:#f3f5fb}
.row.sel{background:#ffe9a8!important}
.row.sel::before{content:'';position:absolute;left:calc(var(--u)*3);top:50%;margin-top:calc(var(--u)*-3.5);border-top:calc(var(--u)*3.5) solid transparent;border-bottom:calc(var(--u)*3.5) solid transparent;border-left:calc(var(--u)*5) solid #e2566f}
.row.dis{color:#9aa0b4}
.row .r{margin-left:auto}
.row img{width:calc(var(--u)*16);height:calc(var(--u)*16);image-rendering:pixelated}
.arrow{position:absolute;left:50%;margin-left:calc(var(--u)*-5);width:0;height:0;border-left:calc(var(--u)*5) solid transparent;border-right:calc(var(--u)*5) solid transparent;animation:bob .5s infinite alternate;pointer-events:none}
.arrow.up{border-bottom:calc(var(--u)*5) solid #e2566f}
.arrow.dn{border-top:calc(var(--u)*5) solid #e2566f}

/* ---------- 타입 배지 / 상태 ---------- */
.tb{display:inline-block;min-width:calc(var(--u)*26);padding:0 calc(var(--u)*3);border-radius:calc(var(--u)*3);color:#fff;font-size:calc(var(--u)*8);line-height:calc(var(--u)*11);text-align:center;text-shadow:0 1px 0 rgba(0,0,0,.45);border:1px solid rgba(0,0,0,.25);vertical-align:middle}
.stb{display:inline-block;padding:0 calc(var(--u)*2);border-radius:calc(var(--u)*2);color:#fff;font-size:calc(var(--u)*7);line-height:calc(var(--u)*10);vertical-align:middle}
.hpb{position:relative;height:calc(var(--u)*4);background:#454a5e;border-radius:calc(var(--u)*2);overflow:hidden;border:1px solid #2a2e3c}
.hpb i{position:absolute;left:0;top:0;bottom:0;width:100%}
.hpl{display:flex;align-items:center;gap:calc(var(--u)*2);font-size:calc(var(--u)*7);font-weight:bold;color:#f2a33c}
.hpl .hpb{flex:1}

/* ---------- 전투 HUD ---------- */
.hud{position:absolute;padding:calc(var(--u)*3) calc(var(--u)*7) calc(var(--u)*3) calc(var(--u)*8);background:linear-gradient(#fdfdf6,#e9ecd8);border:calc(var(--u)*1.5) solid #3d4258;box-shadow:0 calc(var(--u)*2) 0 rgba(0,0,0,.35);transition:transform .35s cubic-bezier(.2,.8,.3,1);font-size:calc(var(--u)*9.5)}
.hud .hn{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--u)*3);line-height:calc(var(--u)*13)}
.hud .lv{font-size:calc(var(--u)*8.5)}
.hud .hpt{text-align:right;font-size:calc(var(--u)*9);line-height:calc(var(--u)*11)}
.hud .exp{height:calc(var(--u)*2.5);background:#c4c8d6;margin:calc(var(--u)*1) calc(var(--u)*-3) 0;overflow:hidden}
.hud .exp i{display:block;height:100%;width:0;background:#3fa9f5}
#hudE{left:0;top:calc(var(--u)*14);width:calc(var(--u)*118);border-radius:0 calc(var(--u)*9) calc(var(--u)*9) 0;border-left:none}
#hudP{right:0;top:calc(var(--u)*92);width:calc(var(--u)*120);border-radius:calc(var(--u)*9) 0 0 calc(var(--u)*9);border-right:none}
#hudE.out{transform:translateX(-110%)}
#hudP.out{transform:translateX(110%)}
.ballrow{position:absolute;display:flex;gap:calc(var(--u)*2);padding:calc(var(--u)*2) calc(var(--u)*4);background:rgba(30,34,52,.75);transition:transform .35s}
.ballrow i{display:block;width:calc(var(--u)*8);height:calc(var(--u)*8);border-radius:50%;background:linear-gradient(#5d8dff 50%,#eee 50%);border:1px solid #111}
.ballrow i.f{background:#666}
.ballrow i.e{background:none;border:1px dashed #999}

/* ---------- 카드·패널 ---------- */
.page{position:absolute;inset:0;overflow:hidden;z-index:6}
.sheet{position:absolute;background:#fdfdf8;border-radius:calc(var(--u)*6);border:calc(var(--u)*2) solid #5a6488;box-shadow:0 calc(var(--u)*2) 0 rgba(0,0,0,.3);padding:calc(var(--u)*6) calc(var(--u)*8)}
.title-bar{position:absolute;left:0;right:0;top:0;height:calc(var(--u)*18);display:flex;align-items:center;padding:0 calc(var(--u)*8);color:#fff;font-size:calc(var(--u)*10);text-shadow:0 1px 0 rgba(0,0,0,.4);background:linear-gradient(#5a6488,#3d4562);border-bottom:calc(var(--u)*1.5) solid #262b40}
.title-bar .r{margin-left:auto;font-size:calc(var(--u)*9)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:calc(var(--u)*1) calc(var(--u)*8);font-size:calc(var(--u)*9.5)}
.kv b{font-weight:normal;color:#6a7190}
.kv span{text-align:right}
.big{image-rendering:pixelated}
.desc{font-size:calc(var(--u)*9);line-height:1.5;color:#3c4260;word-break:keep-all}
.up{color:#e2566f}.dn{color:#3d7ad6}
.stat-grid{display:grid;grid-template-columns:1fr auto;row-gap:calc(var(--u)*1.5);font-size:calc(var(--u)*9.5)}
.stat-grid .bar{grid-column:1/3;height:calc(var(--u)*3);background:#dde1ec;border-radius:2px;overflow:hidden;margin-top:calc(var(--u)*-1)}
.stat-grid .bar i{display:block;height:100%;background:linear-gradient(90deg,#7fd36b,#f2c94c)}
.mvline{display:flex;align-items:center;gap:calc(var(--u)*4);padding:calc(var(--u)*2) 0;border-bottom:1px dashed #cfd3e2;font-size:calc(var(--u)*9.5)}
.mvline .r{margin-left:auto}

/* ---------- 지도 표지판 ---------- */
#sign{position:absolute;left:calc(var(--u)*4);top:calc(var(--u)*4);padding:calc(var(--u)*3) calc(var(--u)*12);font-size:calc(var(--u)*10);color:#3a2a14;background:linear-gradient(#f2d9a4,#d9b571);border:calc(var(--u)*1.5) solid #6b4a23;border-radius:calc(var(--u)*3);box-shadow:inset 0 0 0 calc(var(--u)*1) #f8e8c4,0 calc(var(--u)*2) 0 rgba(0,0,0,.35);transition:transform .35s cubic-bezier(.2,.8,.3,1);transform:translateY(calc(var(--u)*-40));z-index:5;pointer-events:none}
#sign.on{transform:none}

/* ---------- 원정패드 (아래 화면) ---------- */
#padUI .dev{position:absolute;left:calc(var(--u)*18);top:calc(var(--u)*10);width:calc(var(--u)*220);height:calc(var(--u)*140);border-radius:calc(var(--u)*14);background:linear-gradient(#e75a5a,#b93244);box-shadow:inset 0 calc(var(--u)*2) 0 rgba(255,255,255,.3),0 calc(var(--u)*3) 0 rgba(0,0,0,.35)}
#padUI .lcd{position:absolute;left:calc(var(--u)*26);top:calc(var(--u)*12);right:calc(var(--u)*26);bottom:calc(var(--u)*12);border-radius:calc(var(--u)*6);background:#cfe8c1;box-shadow:inset 0 0 0 calc(var(--u)*2) #2f4a2a,inset 0 calc(var(--u)*3) calc(var(--u)*6) rgba(0,0,0,.25);overflow:hidden;color:#24391f}
#padUI .lcd canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#padUI .lcd .t{position:absolute;left:0;right:0;text-align:center}
#padUI .nav{position:absolute;top:calc(var(--u)*56);width:calc(var(--u)*18);height:calc(var(--u)*28);border-radius:calc(var(--u)*5);background:#7a1e2c;color:#ffd9d9;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:calc(var(--u)*10);box-shadow:0 calc(var(--u)*2) 0 rgba(0,0,0,.35)}
#padUI .nav:active{transform:translateY(calc(var(--u)*1))}
#padUI .dots{position:absolute;left:0;right:0;bottom:calc(var(--u)*3);display:flex;justify-content:center;gap:calc(var(--u)*4)}
#padUI .dots i{width:calc(var(--u)*4);height:calc(var(--u)*4);border-radius:50%;background:#7a1e2c}
#padUI .dots i.on{background:#fff}

/* ---------- 입력 ---------- */
.namein{position:absolute;font:inherit;font-size:calc(var(--u)*14);text-align:center;border:calc(var(--u)*2) solid #5a6488;border-radius:calc(var(--u)*5);background:#fff;color:var(--ink);padding:0;-webkit-user-select:text;user-select:text;outline:none}
.namein:focus{box-shadow:0 0 0 calc(var(--u)*2) var(--hi)}

/* ---------- 타이틀 ---------- */
.logo{position:absolute;left:0;right:0;top:calc(var(--u)*20);text-align:center;pointer-events:none}
.logo h1{margin:0;font-size:calc(var(--u)*30);line-height:1;color:#ffd84a;letter-spacing:calc(var(--u)*1);text-shadow:calc(var(--u)*2) 0 #2b1f6b,calc(var(--u)*-2) 0 #2b1f6b,0 calc(var(--u)*2) #2b1f6b,0 calc(var(--u)*-2) #2b1f6b,calc(var(--u)*2) calc(var(--u)*2) #2b1f6b,calc(var(--u)*-2) calc(var(--u)*2) #2b1f6b,0 calc(var(--u)*5) #14103a}
.logo p{margin:calc(var(--u)*6) 0 0;font-size:calc(var(--u)*8);color:#fff;letter-spacing:calc(var(--u)*3);text-shadow:0 calc(var(--u)*1) #1c3f6b}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.ver{position:absolute;right:calc(var(--u)*4);bottom:calc(var(--u)*2);font-size:calc(var(--u)*7);color:rgba(255,255,255,.8)}

/* ---------- 레벨업 창 ---------- */
.lvbox{position:absolute;right:calc(var(--u)*3);top:calc(var(--u)*3);width:calc(var(--u)*112);z-index:31;font-size:calc(var(--u)*9.5);padding:calc(var(--u)*4) calc(var(--u)*8)}
.lvbox div{display:flex;justify-content:space-between}

/* ---------- 크레딧 ---------- */
.credits{position:absolute;left:calc(var(--u)*14);right:calc(var(--u)*14);top:100%;word-break:keep-all;text-align:center;color:#fff;font-size:calc(var(--u)*10);line-height:2;text-shadow:0 1px 0 #000}
.credits h3{margin:calc(var(--u)*14) 0 0;font-size:calc(var(--u)*9);color:#ffd84a;font-weight:normal;letter-spacing:calc(var(--u)*1)}

/* ---------- 하단 조작 패드 (모바일) ---------- */
#pad{--pb:52px;position:relative;display:none;width:min(100%,calc(var(--pb)*6.4));justify-content:space-between;align-items:center;padding:0 2px}
#pad button{border:none;font:inherit;color:#cfd3e6;background:#2b2f40;box-shadow:0 3px 0 #171a24;touch-action:none}
/* 원형 방향 패드: 누른 위치의 각도로 방향 결정, 손가락을 밀면 방향 전환 */
.cpad{position:relative;width:calc(var(--pb)*2.7);height:calc(var(--pb)*2.7);border-radius:50%;touch-action:none;
  background:radial-gradient(circle at 50% 42%,#3a3f55 0%,#2b2f40 62%,#23263394 100%);box-shadow:0 4px 0 #171a24,inset 0 2px 0 rgba(255,255,255,.08),inset 0 0 0 2px #1d2030}
.cpad::before{content:'';position:absolute;inset:18%;border-radius:50%;border:1px solid rgba(255,255,255,.06)}
.cpad .ar{position:absolute;font-style:normal;color:#8d93ad;font-size:calc(var(--pb)*.3);line-height:1;transform:translate(-50%,-50%);pointer-events:none;transition:color .08s}
.cpad .up{left:50%;top:15%}.cpad .down{left:50%;top:85%}.cpad .left{left:15%;top:50%}.cpad .right{left:85%;top:50%}
.cpad .knob{position:absolute;left:50%;top:50%;width:38%;height:38%;margin:-19% 0 0 -19%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 45% 35%,#575d78,#33374a);box-shadow:0 2px 0 #171a24,inset 0 1px 0 rgba(255,255,255,.15);transition:transform .06s}
.cpad[data-d=up] .up,.cpad[data-d=down] .down,.cpad[data-d=left] .left,.cpad[data-d=right] .right{color:#ffcf3a}
.cpad[data-d=up] .knob{transform:translateY(-28%)}.cpad[data-d=down] .knob{transform:translateY(28%)}.cpad[data-d=left] .knob{transform:translateX(-28%)}.cpad[data-d=right] .knob{transform:translateX(28%)}
.mid{position:absolute;left:50%;top:0;transform:translateX(-50%)}
.mid .pill{width:calc(var(--pb)*1.1);height:calc(var(--pb)*.42);border-radius:calc(var(--pb)*.21);font-size:calc(var(--pb)*.19);letter-spacing:1px}
.ab{position:relative;width:calc(var(--pb)*2.05);height:calc(var(--pb)*2.4)}
.ab button{position:absolute;width:calc(var(--pb)*1.15);height:calc(var(--pb)*1.15);border-radius:50%;font-size:calc(var(--pb)*.36)}
#pad .ab [data-k=a]{right:0;top:calc(var(--pb)*.2);background:#e2566f;color:#fff}#pad .ab [data-k=b]{left:0;top:calc(var(--pb)*1.15);background:#3d7ad6;color:#fff}
#pad button.down{transform:translateY(2px);box-shadow:0 1px 0 #171a24}
/* 모바일: 본체 테두리를 얇게 해서 화면을 넓게 */
#ds.slim{padding:calc(var(--u)*2);border-radius:calc(var(--u)*6)}
#ds.slim .bezel{padding:calc(var(--u)*1.5);border-radius:calc(var(--u)*3)}
#ds.slim #hinge{height:calc(var(--u)*5)}
@media (pointer:coarse){#app{padding:4px;gap:6px}}
/* 휴대폰 가로: 방향 패드는 왼쪽, A/B는 오른쪽 */
body.land #pad{position:fixed;left:0;right:0;bottom:0;top:0;width:auto;padding:0 6px;pointer-events:none;z-index:50}
body.land #pad>*{pointer-events:auto}
body.land #pad .mid{left:auto;right:8px;top:8px;transform:none}
#help{font-size:12px;color:#8f95ae;text-align:center;line-height:1.7}
#help b{color:#e8e8f0;font-weight:normal;background:#262a3a;padding:1px 6px;border-radius:4px}
@media (pointer:coarse){#pad{display:flex}#help{display:none}}

/* ---------- 파티 칸 ---------- */
.btn.pcell{flex-direction:row;justify-content:flex-start;text-align:left;padding:0 calc(var(--u)*4);gap:calc(var(--u)*3);background:linear-gradient(#f4fbff,#cfe6f8);border-radius:calc(var(--u)*8) calc(var(--u)*3)}
.btn.pcell.first{background:linear-gradient(#fff8e0,#f6dc9a)}
.btn.pcell.ko{background:linear-gradient(#ffe0e0,#f2a8a8)}
.btn.pcell.empty{background:rgba(255,255,255,.25);border-style:dashed;box-shadow:none}
.pcell img{width:calc(var(--u)*24);height:calc(var(--u)*24);image-rendering:pixelated;flex:none}
.btn.sel.pcell img{animation:hop .28s infinite alternate}
@keyframes hop{to{transform:translateY(calc(var(--u)*-3))}}
.pcell .inf{flex:1;min-width:0}
.pcell .nm{font-size:calc(var(--u)*9.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcell .sub{display:flex;justify-content:space-between;align-items:center;font-size:calc(var(--u)*8);line-height:calc(var(--u)*11)}
.pcell .hpb{margin:calc(var(--u)*1) 0}
.tile{gap:calc(var(--u)*2)}
.tile img{width:calc(var(--u)*24);height:calc(var(--u)*24)}
.tile span{font-size:calc(var(--u)*10)}
.mvbtn{align-items:flex-start;text-align:left;padding:calc(var(--u)*3) calc(var(--u)*8);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.45)}
.mvbtn .mn{font-size:calc(var(--u)*12)}
.mvbtn .mi{display:flex;justify-content:space-between;width:100%;font-size:calc(var(--u)*8.5)}
.mvbtn .hint{font-size:calc(var(--u)*7.5);opacity:.95}
.tab{border-radius:calc(var(--u)*6) calc(var(--u)*6) calc(var(--u)*2) calc(var(--u)*2)}
.tab.on{background:linear-gradient(#ffe58a,#f0b429);color:#4a3200;border-color:#8a6100}
.pc-in{display:flex;align-items:center;gap:calc(var(--u)*6)}
.badge-slot{position:absolute;width:calc(var(--u)*72);height:calc(var(--u)*72);border-radius:50%;background:radial-gradient(#3a3f55,#1d2030);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 calc(var(--u)*2) calc(var(--u)*6) rgba(0,0,0,.6)}
.badge-slot img{width:72%;height:72%;image-rendering:pixelated;filter:drop-shadow(0 0 calc(var(--u)*3) rgba(255,240,180,.8))}
.lcdt{font-family:'Galmuri9','Galmuri11',monospace}

/* 대화창이 떠 있는 동안 아래쪽 설명 상자는 숨겨 겹치지 않게 */
#topUI .page .desc.under-dlg{visibility:hidden}
/* 안내 툴팁 */
#ds{position:relative}
.guide{position:absolute;z-index:200;overflow:hidden;border-radius:calc(var(--u)*1.5);animation:gin .18s ease-out}
.guide.dim{background:rgba(8,10,24,.5)}
.guide.out{opacity:0;transition:opacity .15s}
.gspot{position:absolute;border-radius:calc(var(--u)*8);box-shadow:0 0 0 9999px rgba(8,10,24,.55),0 0 0 calc(var(--u)*1.5) #ffcf3a inset;animation:gpulse 1s ease-in-out infinite alternate;pointer-events:none}
.gbub{position:absolute;padding:calc(var(--u)*6) calc(var(--u)*8) calc(var(--u)*5);background:#fffdf2;color:#2b2f45;border:calc(var(--u)*1.5) solid #3d4562;border-radius:calc(var(--u)*6);box-shadow:0 calc(var(--u)*2) 0 rgba(0,0,0,.35);font-size:calc(var(--u)*9);line-height:1.5;word-break:keep-all}
.gbub .gt{display:inline-block;margin-bottom:calc(var(--u)*3);padding:0 calc(var(--u)*5);border-radius:calc(var(--u)*3);background:#ffcf3a;color:#5a3a00;font-size:calc(var(--u)*7.5);line-height:calc(var(--u)*11)}
.gbub .gx b{color:#d2405a;font-weight:normal}
.gbub .gk{margin-top:calc(var(--u)*3);text-align:right;font-size:calc(var(--u)*7);color:#8a90a8}
.garr{position:absolute;width:0;height:0;margin-left:calc(var(--u)*-5);border-left:calc(var(--u)*5) solid transparent;border-right:calc(var(--u)*5) solid transparent}
.garr.up{top:calc(var(--u)*-6.5);border-bottom:calc(var(--u)*6) solid #3d4562}
.garr.dn{bottom:calc(var(--u)*-6.5);border-top:calc(var(--u)*6) solid #3d4562}
@keyframes gin{from{opacity:0}}
@keyframes gpulse{to{box-shadow:0 0 0 9999px rgba(8,10,24,.55),0 0 0 calc(var(--u)*2.5) #ffcf3a inset}}

.codebox{position:absolute;font:inherit;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:calc(var(--u)*7);line-height:1.35;word-break:break-all;resize:none;border:calc(var(--u)*2) solid #5a6488;border-radius:calc(var(--u)*5);background:#fff;color:var(--ink);padding:calc(var(--u)*4);-webkit-user-select:text;user-select:text;outline:none}

.qrbig{position:fixed;inset:0;z-index:999;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:zoom-out}
.qrbig canvas{width:min(92vw,82vh);height:min(92vw,82vh);image-rendering:pixelated}
.qrbig p{margin:0;color:#3d4562;font-size:14px}
/* 대화창 초상화 (벡터 일러스트) */
#dlg .portrait{position:absolute;left:calc(var(--u)*4);bottom:calc(100% - var(--u)*5);width:calc(var(--u)*50);height:calc(var(--u)*54);border-radius:calc(var(--u)*6);
  background:radial-gradient(circle at 50% 30%,#ffffff,#dbe6fb 55%,#b9c9ef);border:calc(var(--u)*2) solid #5a6488;box-shadow:inset 0 0 0 calc(var(--u)*1.5) #fff,0 calc(var(--u)*1.5) 0 rgba(0,0,0,.3);overflow:hidden;animation:porIn .22s ease-out}

#dlg .portrait .bob{animation:porBob 2.6s ease-in-out infinite}
#dlg .portrait .eye{transform-box:fill-box;transform-origin:50% 60%;animation:porBlink 4.2s infinite}
#dlg .portrait .eye+.eye{animation-delay:.02s}
#dlg .portrait .mo{opacity:0}
#dlg .portrait.talk .mo{animation:porMouth .26s steps(1) infinite}

@keyframes porBlink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
@keyframes porMouth{0%{opacity:1}50%{opacity:0}}

@keyframes porIn{from{transform:translateY(calc(var(--u)*6));opacity:0}}
#dlg.withpor .tag{left:calc(var(--u)*58)}

function cry(sid,o={}){if(!AC)return;const R=rng(sid*977+13),base=220+R()*500,len=(.35+R()*.35)*(o.faint?1.4:1),wav=['triangle','sine','triangle'][Math.floor(R()*3)];
  const pitch=o.faint?.7:1,t=AC.currentTime,g=AC.createGain(),o1=AC.createOscillator(),o2=AC.createOscillator(),lfo=AC.createOscillator(),lg=AC.createGain();

  o1.frequency.setValueAtTime(f,t);o1.frequency.linearRampToValueAtTime(f*(1.2+R()*.8),t+len*.25);o1.frequency.linearRampToValueAtTime(f*(.6+R()*.5),t+len);
  o2.frequency.setValueAtTime(f*1.5,t);o2.frequency.linearRampToValueAtTime(f*(.8+R()),t+len);
  lfo.frequency.value=12+R()*30;lg.gain.value=f*(.05+R()*.15);lfo.connect(lg);lg.connect(o1.frequency);lg.connect(o2.frequency);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.3,t+.03);g.gain.setValueAtTime(.26,t+len*.7);g.gain.exponentialRampToValueAtTime(.0001,t+len);
  const g2=AC.createGain();g2.gain.value=.35;o1.connect(g);o2.connect(g2).connect(g);g.connect(sfxGain);
  [o1,o2,lfo].forEach(o=>{o.start(t);o.stop(t+len+.05);});
  return sleep(len*1000);}

function chordNotes(c){const m=/^([A-G][#b]?)(m7|maj7|m|7|sus4|dim)?$/.exec(c);const r=CH[m[1]],q=m[2]||'';

      else if(A==='off'){for(let s=2;s<per;s+=4)chord.forEach(n=>arp.push({t:t0+s,d:1.5,f:midiF(n),v:.32}));}

    for(let s=0;s<16;s++)if(D[s]!=='-')drum.push({t:bi*16+s,k:D[s]});});
  return{bpm:Math.round(S.bpm*(S.bpm>150?.78:.86)),steps,mel:mel.ev,melLen:Math.max(mel.len,1),bass,arp,drum,loop:S.loop!==false,lead:S.lead||.25};}

    else{g.gain.linearRampToValueAtTime(v,t+.025);g.gain.linearRampToValueAtTime(v*.7,t+Math.min(.15,d*.5));g.gain.linearRampToValueAtTime(v*.5,t+d*.9);g.gain.linearRampToValueAtTime(.0001,t+d+.04);}o.connect(g).connect(bgmGain);o.start(t);o.stop(t+d+.06);o._end=t+d+.08;this.nodes.push(o);},

    s.connect(fl).connect(g).connect(bgmGain);s.start(t,Math.random()*.5);s.stop(t+.2);this.nodes.push(s);},
  /* 짧은 팡파르: BGM을 잠시 멈추고 연주 */
  async jingle(name){if(!AC){await sleep(400);return;}const J=JINGLES[name],resume=this.cur;this.stop(true);this.jingling=true;

    ch.forEach(n=>this.note(midiF(48+n),len*dt,{type:'triangle',v:.5,t:t0}));

};

/* =========================================================
   ui.js — 대화창, 터치 버튼 패널, 스크롤 리스트, 예/아니오, 수량, 이름 입력
   ========================================================= */
const TOP=$('#topUI'),BOT=$('#botUI');
const U=n=>`calc(var(--u) * ${n})`;
function el(root,cls,html,rect,tag='div'){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(rect)place(e,rect);root.append(e);return e;}
function place(e,[x,y,w,h]){e.style.left=U(x);e.style.top=U(y);if(w!=null)e.style.width=U(w);if(h!=null)e.style.height=U(h);}

/* ---------- 대화창 (위 화면) ---------- */
const dlg=el(TOP,'hidden','<span class="tx"></span><i class="nx hidden"></i>');dlg.id='dlg';
const dtx=dlg.querySelector('.tx'),dnx=dlg.querySelector('.nx');let dtag=null,dlgTm=null;
function msg(text,o={}){clearTimeout(dlgTm);dlgShow();setTag(o.name,o.look);const pg=paginate(text);dtx.textContent=pg[pg.length-1];dnx.classList.add('hidden');setTag(o.name,o.look);}
function setTag(name,look){if(dtag){dtag.remove();dtag=null;}if(name){dtag=el(dlg,'tag',esc(name));}setPortrait(name,look);}
/* 말하는 사람 얼굴: 이름으로 외형을 찾아 대화창 왼쪽 위에 표시 */
const NAME_LOOK={'한결 박사':'prof','엄마':'mom','간호사':'nurse','점원':'clerk','합성 연구원':'aide','연구원':'aide','경비원':'guide','관장 단단':'leaderRock','관장 하라':'leaderWater','누나':'sister'};
let dpor=null,dporKey='';
function lookFor(name){if(!name)return null;if(typeof RIVAL!=='undefined'&&name===RIVAL)return'rival';
  try{const n=npcsOf(curMap()).find(x=>x.name===name);if(n&&n.look)return n.look;}catch(e){}
  if(NAME_LOOK[name])return NAME_LOOK[name];
  if(typeof B!=='undefined'&&B&&B.o&&B.o.look&&(name===B.o.name||name.endsWith(' '+B.o.name)))return B.o.look;
  return null;}
function setPortrait(name,look){look=look||lookFor(name);const L=look&&LOOK[look];
  if(!L){if(dpor){dpor.remove();dpor=null;dporKey='';}dlg.classList.remove('withpor');return;}
  if(dpor&&dporKey===look)return;if(dpor)dpor.remove();
  dpor=el(dlg,'portrait',portraitSVG(look));dporKey=look;dlg.classList.add('withpor');}
function porTalk(on){if(dpor)dpor.classList.toggle('talk',!!on);}
function dlgShow(){dlg.classList.remove('hidden');const d=dlg.getBoundingClientRect();
  // 대화창과 실제로 겹치는 설명 상자만 잠시 숨긴다
  TOP.querySelectorAll('.page .desc').forEach(e=>{const r=e.getBoundingClientRect();e.classList.toggle('under-dlg',r.height>0&&r.bottom>d.top+2);});}
function hideMsg(){dlg.classList.add('hidden');TOP.querySelectorAll('.under-dlg').forEach(e=>e.classList.remove('under-dlg'));setTag(null);}
/* 대화창 2줄 단위로 나누기 (넘치면 A로 다음 페이지) */
function dlgLines(t){dtx.style.maxHeight='none';dtx.textContent=t||' ';const lh=parseFloat(getComputedStyle(dtx).lineHeight)||16;const n=Math.round(dtx.offsetHeight/lh);dtx.style.maxHeight='';return n;}
function fitCut(rest,max=2){if(dlgLines(rest)<=max)return rest.length;
  let lo=1,hi=rest.length;while(lo<hi){const m=(lo+hi+1)>>1;if(dlgLines(rest.slice(0,m))<=max)lo=m;else hi=m-1;}
  let cut=lo;const sp=Math.max(rest.lastIndexOf(' ',cut),rest.lastIndexOf('\n',cut));
  if(sp>cut*.4&&!/[\s]/.test(rest[cut]||''))cut=sp; // 단어 중간에서 자르지 않기
  return Math.max(1,cut);}
/* 지금 글꼴 기준으로 첫 페이지와 나머지 */
function splitPage(rest){rest=String(rest);if(!dlg.offsetWidth)return[rest,''];const c=fitCut(rest);const pg=rest.slice(0,c).replace(/\s+$/,''),r=rest.slice(c).replace(/^\s+/,'');dtx.textContent='';return[pg,r];}
function paginate(text){const pages=[];let rest=String(text);do{const[a,b]=splitPage(rest);pages.push(a);rest=b;}while(rest.length);return pages;}
const CPS=[45,22,6];
function say(text,o={}){return new Promise(res=>{clearTimeout(dlgTm);dlgShow();setTag(o.name,o.look);dnx.classList.add('hidden');
  let rest=String(text),cur='';dtx.textContent='';
  let i=0,done=false,closed=false,at=null,tm=null;const sp=CPS[SET.text]||22;
  const last=()=>!rest.length;
  // 페이지마다 그 순간의 글꼴·화면 크기로 다시 잰다 (웹폰트 늦게 로드, 화면 회전 대응)
  const start=()=>{[cur,rest]=splitPage(rest);i=0;done=false;dtx.textContent='';dnx.classList.add('hidden');porTalk(1);tm=setInterval(()=>{i+=sp<10?3:1;dtx.textContent=cur.slice(0,i);if(i>=cur.length)fin();},sp);};
  const fin=()=>{clearInterval(tm);porTalk(0);
    if(dlg.offsetWidth&&dlgLines(cur)>2){const c=fitCut(cur);rest=(cur.slice(c).replace(/^\s+/,'')+(rest?' '+rest:''));cur=cur.slice(0,c).replace(/\s+$/,'');}
    dtx.textContent=cur;done=true;
    if(o.auto)at=setTimeout(()=>last()?close():next(),o.auto*(SET.text===2?.6:SET.text===0?1.4:1));else dnx.classList.remove('hidden');};
  const next=()=>{clearTimeout(at);start();};
  const close=()=>{if(closed)return;closed=true;clearTimeout(at);popH(h);dnx.classList.add('hidden');if(!o.keep)dlgTm=setTimeout(()=>{if(!ui.some(x=>x.isSay))hideMsg();},30);res();};
  const h={isSay:1,tapA:1,key(k){if(k!=='a'&&k!=='b')return;if(!done){fin();return;}if(!o.auto)sfx('cur');if(last())close();else next();}};
  start();pushH(h);});}
/* 여러 줄 연속 */
async function talk(lines,o={}){for(const l of lines)await say(l,o);}

/* ---------- 버튼 패널 (방향키로 가까운 버튼 이동) ---------- */
function panel(btns,o={}){return new Promise(res=>{const root=o.root||BOT,wrap=el(root,'abs','',[0,0,256,192]);wrap.style.pointerEvents='none';
  if(o.backdrop){const bd=el(wrap,'backdrop '+(o.backdrop===true?'':o.backdrop));bd.style.pointerEvents='auto';if(o.bg)bd.style.background=o.bg;}
  if(o.html)el(wrap,'abs',o.html,[0,0,256,192]).style.pointerEvents='none';
  let idx=clamp(o.start||0,0,btns.length-1);while(btns[idx]&&btns[idx].skip)idx++;
  const els=btns.map((b,i)=>{const e=el(wrap,'btn '+(b.cls||'')+(b.disabled?' dis':''),b.html,[b.x,b.y,b.w,b.h]);e.style.pointerEvents='auto';
    e.addEventListener('pointerdown',ev=>{ev.stopPropagation();if(topH()!==h)return;if(b.disabled){sfx('bad');return;}e.classList.add('press');});
    e.addEventListener('pointerup',()=>e.classList.remove('press'));e.addEventListener('pointerleave',()=>e.classList.remove('press'));
    e.addEventListener('click',ev=>{ev.stopPropagation();if(topH()!==h)return;idx=i;draw();pick();});return e;});
  const draw=()=>{els.forEach((e,i)=>e.classList.toggle('sel',i===idx&&!o.noSel));if(o.onMove)o.onMove(idx,els[idx]);};
  const close=v=>{popH(h);if(!o.keep)wrap.remove();res(v);};
  const pick=()=>{const b=btns[idx];if(b.disabled){sfx('bad');return;}if(!o.silent)sfx(b.sfx||'sel');if(b.flash){els[idx].classList.add('press');setTimeout(()=>close(idx),90);}else close(idx);};
  const move=(dx,dy)=>{const a=btns[idx],ax=a.x+a.w/2,ay=a.y+a.h/2;let best=-1,bd=1e9;
    btns.forEach((b,i)=>{if(i===idx||b.skip)return;const bx=b.x+b.w/2,by=b.y+b.h/2,ddx=bx-ax,ddy=by-ay;
      const along=dx?ddx*dx:ddy*dy,across=dx?Math.abs(ddy):Math.abs(ddx);if(along<=2)return;const d=along+across*2.2;if(d<bd){bd=d;best=i;}});
    if(best>=0){idx=best;sfx('cur');draw();}};
  const h={wrap,els,key(k){if(k==='up')move(0,-1);else if(k==='down')move(0,1);else if(k==='left')move(-1,0);else if(k==='right')move(1,0);
    else if(k==='a')pick();else if(k==='b'||(k==='menu'&&o.menuClose)){if(o.cancel===false)return;sfx('back');close(o.cancel!=null?o.cancel:-1);}
    else if(o.onKey)o.onKey(k,idx,close);},set(i){idx=i;draw();}};
  h.refresh=(i,html)=>{els[i].innerHTML=html;};
  pushH(h);draw();if(o.onOpen)o.onOpen(h);});}

/* ---------- 스크롤 리스트 ---------- */
function list(items,o={}){return new Promise(res=>{const root=o.root||BOT,[x,y,w,hh]=o.rect||[4,4,248,160],rh=o.rowH||20,vis=Math.floor((hh-4)/rh);
  const wrap=el(root,'abs','',[0,0,256,192]);wrap.style.pointerEvents='none';
  if(o.backdrop){const bd=el(wrap,'backdrop');bd.style.pointerEvents='auto';if(o.bg)bd.style.background=o.bg;}
  if(o.html)el(wrap,'abs',o.html,[0,0,256,192]).style.pointerEvents='none';
  const box=el(wrap,'lst','',[x,y,w,hh]);box.style.pointerEvents='auto';const inner=el(box,'in');
  const au=el(box,'arrow up hidden'),ad=el(box,'arrow dn hidden');au.style.top=U(1);ad.style.bottom=U(1);
  let idx=clamp(o.start||0,0,Math.max(0,items.length-1)),off=clamp(idx-Math.floor(vis/2),0,Math.max(0,items.length-vis));
  const rows=items.map((it,i)=>{const r=el(inner,'row'+(it.disabled?' dis':''),it.html);r.style.height=U(rh);
    r.addEventListener('click',ev=>{ev.stopPropagation();if(topH()!==h)return;if(idx===i||o.tapPick!==false){idx=i;draw();pick();}else{idx=i;draw();}});return r;});
  const extra=(o.buttons||[]).map((b,j)=>{const e=el(wrap,'btn '+(b.cls||''),b.html,[b.x,b.y,b.w,b.h]);e.style.pointerEvents='auto';
    e.addEventListener('click',ev=>{ev.stopPropagation();if(topH()!==h)return;sfx('back');close(b.val!=null?b.val:-1);});return e;});
  const draw=()=>{if(idx<off)off=idx;if(idx>=off+vis)off=idx-vis+1;inner.style.transform=`translateY(${U(-off*rh)})`;
    rows.forEach((r,i)=>r.classList.toggle('sel',i===idx));au.classList.toggle('hidden',off<=0);ad.classList.toggle('hidden',off+vis>=items.length);if(o.onMove&&items.length)o.onMove(idx);};
  const close=v=>{popH(h);if(!o.keep)wrap.remove();res(v);};
  const pick=()=>{if(!items.length)return;if(items[idx].disabled&&!o.allowDisabled){sfx('bad');return;}sfx('sel');close(idx);};
  const h={wrap,key(k){const n=items.length;if(o.onKey&&o.keys&&o.keys.includes(k)){o.onKey(k,idx,close);return;}if(!n&&k!=='b')return;
    if(k==='up'){idx=(idx-1+n)%n;sfx('cur');draw();}else if(k==='down'){idx=(idx+1)%n;sfx('cur');draw();}
    else if(k==='left'){idx=Math.max(0,idx-vis);sfx('cur');draw();}else if(k==='right'){idx=Math.min(n-1,idx+vis);sfx('cur');draw();}
    else if(k==='a')pick();else if(k==='b'){if(o.cancel===false)return;sfx('back');close(-1);}
    else if(o.onKey)o.onKey(k,idx,close);},
    update(i,html){rows[i].innerHTML=html;}};
  box.addEventListener('wheel',e=>{e.preventDefault();h.key(e.deltaY>0?'down':'up');},{passive:false});
  pushH(h);draw();if(o.onOpen)o.onOpen(h);});}

/* ---------- 예 / 아니오 ---------- */
async function ask(text,opts=['예','아니오'],o={}){dlgShow();setTag(o.name,o.look);const pg=paginate(text);for(let i=0;i<pg.length-1;i++)await say(pg[i],{...o,keep:1});msg(pg[pg.length-1],o);

/* ---------- 수량 선택 ---------- */
function numberPick(o){return new Promise(res=>{let n=1;const max=Math.max(1,o.max);

  const mk=(html,r,cls,f)=>{const e=el(wrap,'btn '+cls,html,r);e.addEventListener('click',ev=>{ev.stopPropagation();if(topH()!==h)return;f();});return e;};
  mk('−1',[12,134,52,26],'',()=>h.key('left'));mk('+1',[70,134,52,26],'',()=>h.key('right'));mk('−10',[12,164,52,24],'',()=>h.key('down'));mk('+10',[70,164,52,24],'',()=>h.key('up'));
  mk('결정',[132,134,58,54],'blue',()=>h.key('a'));mk('취소',[196,134,52,54],'',()=>h.key('b'));

/* ---------- 이름 입력 ---------- */
function nameInput(o){return new Promise(res=>{const wrap=el(BOT,'abs','',[0,0,256,192]);el(wrap,'backdrop').style.background='linear-gradient(#e8eefc,#c8d4f0)';

/* ---------- 처음 쓰는 기능 안내 툴팁 ----------

const GUIDE_KEY='monster-expedition-guides-v2';let GUIDES={};
try{GUIDES=JSON.parse(localStorage.getItem(GUIDE_KEY)||'{}');}catch(e){}
function guideSeen(id){return !SET.tips||!!GUIDES[id];}
function guideReset(){GUIDES={};try{localStorage.removeItem(GUIDE_KEY);}catch(e){}}
let guideQ=Promise.resolve();
function guide(id,target,text,o={}){if(guideSeen(id))return Promise.resolve();GUIDES[id]=1;try{localStorage.setItem(GUIDE_KEY,JSON.stringify(GUIDES));}catch(e){}
  return guideQ=guideQ.then(()=>new Promise(res=>{
    const ds=$('#ds'),dr=ds.getBoundingClientRect(),u=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u'))||2;
    let el0=typeof target==='function'?target():typeof target==='string'?(target==='top'?$('#scrTop'):target==='bot'?$('#scrBot'):document.querySelector(target)):target;
    if(el0&&!el0.getClientRects().length)el0=null;
    const scr=(el0&&el0.closest('.scr'))||$(o.screen==='top'?'#scrTop':'#scrBot')||ds,sr=scr.getBoundingClientRect();
    const r=el0?el0.getBoundingClientRect():null,whole=!el0||el0===scr;
    const lay=document.createElement('div');lay.className='guide';lay.style.cssText=`left:${sr.left-dr.left}px;top:${sr.top-dr.top}px;width:${sr.width}px;height:${sr.height}px`;
    const pad=u*2.5;
    if(r&&!whole){const sp=document.createElement('div');sp.className='gspot';sp.style.cssText=`left:${r.left-sr.left-pad}px;top:${r.top-sr.top-pad}px;width:${r.width+pad*2}px;height:${r.height+pad*2}px`;lay.appendChild(sp);}
    else lay.classList.add('dim');
    const bub=document.createElement('div');bub.className='gbub';

/* ---------- 저장 코드 (다른 기기로 옮기기) ----------
   형식: ME2-<체크섬4>-<base64url(deflate(JSON))>  · 압축을 못 쓰는 브라우저는 ME2U-(무압축) */
const b64u={enc:u8=>{let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');},
  dec:t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}};
function ck4(t){let h=2166136261;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619);}return(h>>>0).toString(36).slice(-4).padStart(4,'0').toUpperCase();}

/* ================= PC 보관함 =================
   맡긴 몬스터는 실제 시간이 흐른 만큼 자란다: BOX_MIN분마다 레벨 1 (파티 최고 레벨까지). */
const BOX_MIN=10;
function boxCap(){return Math.max(5,...G.party.map(m=>m.lv));}
/* 보관함 몬스터를 지금 시각까지 키운다 → [{m,from,to,learned:[],full:[]}] */
function boxGrow(){const now=Date.now(),cap=boxCap(),out=[];
  for(const m of G.box){if(!m.boxAt){m.boxAt=now;continue;}
    const steps=Math.floor((now-m.boxAt)/(BOX_MIN*60000));if(steps<=0)continue;
    if(m.lv>=cap){m.boxAt=now;continue;}

async function battle(o){const wild=o.kind==='wild';
  B={o,wild,bg:o.bg||curMap().bg||'grass',foe:o.team.map(([s,l])=>makeMon(s,l,wild?{}:{shiny:false})),fi:0,pi:Math.max(0,G.party.findIndex(m=>m.hp>0)),
    st:{p:[0,0,0,0,0,0],e:[0,0,0,0,0,0]},flinch:{},moved:{},slide:0,e:blank(),p:blank(),etr:{show:false,x:0},ptr:{show:false,x:0},ball:null,shake:0,flash:0,flashCol:'#fff',
    part:new Set(),runs:0,lvUp:new Set(),usedItem:0,result:null,lowT:null};
  if(wild)fm().met={map:curMap().name,lv:fm().lv};
  Music.play(o.music||(wild?'wild':o.cls==='leader'?'leader':o.cls==='rival'?'rival':'trainer'));
  for(let i=0;i<2;i++){transFx={type:'flash'};await sleep(70);transFx=null;await sleep(80);}
  const tt=wild?(B.bg==='forest'?'spin':'bars'):(o.cls==='leader'||o.cls==='rival')?'vs':'iris';
  transFx={type:tt,k:0,label:o.cls==='leader'?`관장 ${o.name}`:o.cls==='rival'?`라이벌 ${o.name}`:''};await tween(tt==='vs'?380:560,k=>transFx.k=k,EASE.in);if(tt==='vs')await sleep(800);
  state='battle';Pad.hide();botMode='battle';makeHud();transFx=null;hideMsg();FX.list=[];
  B.lowT=setInterval(()=>{if(B&&state==='battle'&&B.p.show){const m=pm();if(m&&m.hp>0&&m.hp<=maxHp(m)*.2)sfx('lowhp');}},1100);
  /* 등장 */
  if(wild){B.e.show=true;B.e.dark=true;}else B.etr.show=true;B.ptr.show=true;
  await tween(800,k=>B.slide=k,EASE.out);
  if(wild){const f=fm();G.seen[f.sid]=1;B.e.dark=false;B.e.white=1;await tween(260,k=>B.e.white=1-k);cry(f.sid);if(f.shiny)await shinyFx('e');
    updHud('e');hudE.classList.remove('out');await bsay(`앗! 야생 ${J(N(f),'이')} 나타났다!`);}
  else{ballRow('e',false);ballRow('p',false);await sleep(30);ballRow('e',true);ballRow('p',true);await bsay(`${J(tn(),'이')} 승부를 걸어왔다!`,true);ballRow('e',false);ballRow('p',false);await sendFoe();}
  await sendPlayer();
  let res=null;
  while(!res){res=B.hero?await heroTurn():await doTurn(await chooseAction());}
  return await endBattle(res);}

async function sendFoe(){const f=fm();G.seen[f.sid]=1;B.st.e=[0,0,0,0,0,0];B.part=new Set(B.p.show&&pm().hp>0?[pm()]:[]);B.e=blank();
  if(B.etr.show){await tween(320,k=>B.etr.x=k*130);B.etr.show=false;B.etr.x=0;}
  bsay(`${J(tn(),'은')} ${J(N(f),'을')} 내보냈다!`);
  B.ball={x:EPOS.x+40,y:EPOS.y-70,r:0};await tween(300,k=>{B.ball.x=EPOS.x+40-40*k;B.ball.y=EPOS.y-70+40*k-Math.sin(k*Math.PI)*20;B.ball.r=k*8;});
  await capsuleOpen('e');updHud('e');hudE.classList.remove('out');await sleep(500);}
async function sendPlayer(){const p=pm();B.st.p=[0,0,0,0,0,0];B.part.add(p);B.p=blank();
  bsay(`가랏! ${N(p)}!`);
  if(B.ptr.show)tween(320,k=>B.ptr.x=-k*130).then(()=>{B.ptr.show=false;B.ptr.x=0;});
  sfx('throw');B.ball={x:20,y:150,r:0};await tween(380,k=>{B.ball.x=20+(PPOS.x-20)*k;B.ball.y=150-60*Math.sin(k*Math.PI)-(30*k);B.ball.r=k*10;});
  await capsuleOpen('p');updHud('p');setExp(p,true);hudP.classList.remove('out');await sleep(450);}
async function capsuleOpen(side){const c=center(side);B.ball=null;sfx('open');
  FX.burst(c.x,c.y,16,{c:['#ffffff','#9fd8ff','#ffd84a'],shape:'star',s:3,life:22,sp:2.6});FX.add({x:c.x,y:c.y,shape:'ring',c:'#ffffff',s:4,life:16,grow:2});
  const S=B[side];S.show=true;S.white=1;S.sx=S.sy=.1;await tween(260,k=>{S.sx=S.sy=.1+.9*EASE.back(k);});await tween(220,k=>S.white=1-k);
  const m=SIDE(side);cry(m.sid);if(m.shiny)await shinyFx(side);}
async function shinyFx(side){const c=center(side);sfx('shiny');for(let i=0;i<3;i++){FX.burst(c.x,c.y-6,6,{c:['#fff8b0','#ffffff'],shape:'star',s:4,life:26,sp:1.6});await sleep(160);}}
async function recall(side){const S=B[side];sfx('absorb');S.white=1;await tween(260,k=>{S.sx=S.sy=1-k*.95;});S.show=false;S.sx=S.sy=1;S.white=0;(side==='p'?hudP:hudE).classList.add('out');}

/* ---------- 명령 ---------- */
async function chooseAction(){
  while(true){msg(`${J(N(pm()),'은')}\n무엇을 할까?`);
    guideSoon('battle','#botUI .btn.red','<b>싸운다</b>를 누르면 기술을 고를 수 있어요. 아래의 <b>가방</b>에선 회복약을, <b>몬스터</b>에선 교체를 할 수 있어요.',{title:'전투'});
    if(B.wild&&Object.keys(G.bag).some(k=>ITEMS[k]&&ITEMS[k].ball&&G.bag[k]>0))guideSoon('catch','#botUI .btn.yellow','야생 몬스터는 HP를 줄인 뒤 <b>가방 → 캡슐</b>을 던지면 붙잡을 수 있어요. 잠듦·마비 같은 상태 이상이면 더 잘 잡혀요!',{title:'포획'});
    const i=await panel([{html:`<span style="font-size:${U(20)}">싸운다</span>`,x:24,y:14,w:208,h:104,cls:'red',flash:1},
      {html:`<img src="${menuIcon('bag')}" style="width:${U(22)};height:${U(22)}"><span>가방</span>`,x:4,y:124,w:84,h:64,cls:'yellow'},
      {html:'<span>도망치다</span>',x:96,y:140,w:64,h:48,cls:'blue'},
      {html:`<img src="${menuIcon('party')}" style="width:${U(22)};height:${U(22)}"><span>몬스터</span>`,x:168,y:124,w:84,h:64,cls:'green'}],{cancel:false,start:0});
    if(i===0){const mi=await chooseMove();if(mi==='back')continue;return{type:'move',mi};}
    if(i===1){hideMsg();const r=await bagScreen('battle');if(!r)continue;return{type:'item',...r};}
    if(i===3){hideMsg();const j=await partyScreen('battle');if(j<0)continue;return{type:'switch',idx:j};}
    return{type:'run'};}}
async function chooseMove(){const p=pm(),f=fm();
  if(p.moves.every(x=>x.pp<=0)){await bsay(`${J(N(p),'은')} 쓸 수 있는 기술이 없다!`,true);return'struggle';}
  msg(`${J(N(p),'은')}\n무엇을 할까?`);
  const btns=p.moves.map((x,j)=>{const d=MV[x.id],e=d.c==='x'?null:effT(d.t,SP[f.sid].t);
    return{html:`<span class="mn">${d.n}</span><span class="mi"><span>${TYPES[d.t].n} · ${CATN[d.c]}</span><span>PP ${x.pp}/${d.pp}</span></span><span class="hint">${e==null?'':e===0?'효과가 없다':e>1?'효과가 굉장하다':e<1?'효과가 별로다':''}</span>`,
      x:4+(j%2)*126,y:6+Math.floor(j/2)*68,w:122,h:62,cls:'mvbtn',disabled:x.pp<=0};});
  btns.push({html:'취소',x:4,y:146,w:248,h:40,cls:'dark'});
  guideSoon('moves','#botUI .mvbtn','기술 버튼에는 <b>타입 · 분류 · 남은 PP</b>가 보여요. 상대에게 잘 통하면 <b>"효과가 굉장하다"</b>라고 미리 알려 줘요.',{title:'기술 고르기'});
  const i=await panel(btns,{onOpen:h=>h.els.forEach((e,j)=>{if(j<p.moves.length){const c=TYPES[MV[p.moves[j].id].t].c;e.style.background=`linear-gradient(${shade(c,.3)},${shade(c,-.1)})`;e.style.borderColor=shade(c,-.5);}})});
  if(i<0||i===btns.length-1)return'back';return i;}

/* ---------- 턴 진행 ---------- */
function speedOf(s){const m=SIDE(s);return calc(m)[5]*mult(B.st[s][5])*(m.st==='par'?.25:1);}
function aiMove(e,p){const av=e.moves.filter(x=>x.pp>0);if(!av.length)return'struggle';let best=av[0].id,bs=-1;
  for(const x of av){const d=MV[x.id];let s;
    if(d.p){const ef=effT(d.t,SP[p.sid].t);s=d.p*ef*(SP[e.sid].t.includes(d.t)?1.5:1)*(d.a?d.a/100:1);if(ef===0)s=1;}
    else if(d.fx.status){const imm=(d.fx.status==='psn'&&SP[p.sid].t.includes('poison'))||(d.fx.status==='brn'&&SP[p.sid].t.includes('fire'))||(d.fx.status==='par'&&(SP[p.sid].t.includes('elec')||SP[p.sid].t.includes('ground')));s=p.st||imm?2:48;}
    else if(d.fx.foe){s=B.st.p[d.fx.foe[0][0]]>-2?32:4;}else if(d.fx.self){s=B.st.e[d.fx.self[0][0]]<2?32:4;}else s=10;
    s*=B.wild?.4+Math.random()*1.3:.75+Math.random()*.5;if(s>bs){bs=s;best=x.id;}}return best;}
async function doTurn(act){B.flinch={};B.moved={};
  const leaderHeal=B.o.leader&&!B.usedItem&&fm().hp>0&&fm().hp<=maxHp(fm())/4;
  const eAct=leaderHeal?{type:'item'}:{type:'move',id:aiMove(fm(),pm())};
  if(act.type==='run'){if(!B.wild){await bsay('안 돼! 트레이너와의 승부에서 등을 보일 수는 없다!',true);return null;}
    if(tryRun()){sfx('run');await bsay('무사히 도망쳤다!',true);return'run';}await bsay('도망칠 수 없었다!');B.moved.p=1;}
  else if(act.type==='switch'){await bsay(`돌아와, ${N(pm())}!`);await recall('p');B.pi=act.idx;await sendPlayer();B.moved.p=1;}
  else if(act.type==='item'){if(ITEMS[act.id].ball){if(await throwBall(act.id))return'caught';}else await useItemBattle(act);B.moved.p=1;}
  if(eAct.type==='item'){B.usedItem=1;G.bag;await bsay(`${J(tn(),'은')} 고급회복약을 사용했다!`);sfx('heal');await animHP('e',fm(),fm().hp+60);B.moved.e=1;}
  const seq=[];
  if(act.type==='move'){const pid=act.mi==='struggle'?'struggle':pm().moves[act.mi].id;
    if(eAct.type==='move'){const pp=MV[pid].fx.pri||0,ep=MV[eAct.id].fx.pri||0,ps=speedOf('p'),es=speedOf('e');
      const pFirst=pp!==ep?pp>ep:ps!==es?ps>es:Math.random()<.5;seq.push(...(pFirst?[['p',pid,act.mi],['e',eAct.id]]:[['e',eAct.id],['p',pid,act.mi]]));}
    else seq.push(['p',pid,act.mi]);}
  else if(eAct.type==='move')seq.push(['e',eAct.id]);
  for(const[s,id,mi]of seq){await useMove(s,id,mi);const c=await checkFaints();if(c==='done')return B.result;if(c==='cut')return null;}
  await endTurn();const c=await checkFaints();if(c==='done')return B.result;
  return null;}
function tryRun(){B.runs++;const a=speedOf('p'),b=speedOf('e');if(a>=b)return true;const f=Math.floor(a*128/b)+30*B.runs;return rnd(256)<f;}
async function checkFaints(){let cut=false;
  if(fm().hp<=0){cut=true;if(!B.wild&&B.fi<B.foe.length-1){B.fi++;await nextFoe();}else{B.result='win';return'done';}}
  if(B.hero)return cut?'cut':false;
  if(pm().hp<=0){cut=true;if(!G.party.some(m=>m.hp>0)){if(!B.heroUsed&&await heroStart())return'cut';B.result='lose';return'done';}
    if(B.wild){const r=await ask('다음 몬스터를 사용하겠습니까?',['다음 몬스터','도망친다']);
      if(r===1){if(tryRun()){sfx('run');await bsay('무사히 도망쳤다!',true);B.result='run';return'done';}await bsay('도망칠 수 없었다!',true);}}
    B.pi=await partyScreen('forced');await sendPlayer();}
  return cut?'cut':false;}
async function nextFoe(){const nf=fm();
  if(SET.style===0&&pm().hp>0&&G.party.filter(m=>m.hp>0).length>1){
    const r=await ask(`${J(tn(),'은')} ${J(N(nf),'을')} 내보내려 한다.\n${G.name}도 몬스터를 교체하겠습니까?`,['예','아니오'],{keep:1});
    if(r===0){const j=await partyScreen('battle');if(j>=0){await bsay(`돌아와, ${N(pm())}!`);await recall('p');B.pi=j;await sendFoe();await sendPlayer();return;}}}
  await sendFoe();}

/* ---------- 기술 사용 ---------- */
async function useMove(side,id,mi){const u=SIDE(side),ts=OTHER(side),t=SIDE(ts);if(u.hp<=0||t.hp<=0)return;B.moved[side]=1;
  if(u.st==='slp'){if(--u.slp<=0){u.st='';u.slp=0;updHud(side);await bsay(`${J(bname(side),'은')} 잠에서 깨어났다!`);}
    else{await statusAnim(side,'slp');await bsay(`${J(bname(side),'은')} 쿨쿨 잠들어 있다.`);return;}}
  if(B.flinch[side]){await bsay(`${J(bname(side),'은')} 풀이 죽어서 기술을 쓸 수 없다!`);return;}
  if(u.st==='par'&&chance(25)){await statusAnim(side,'par');await bsay(`${J(bname(side),'은')} 몸이 저려서 움직일 수 없다!`);return;}
  const mv=MV[id];
  if(id!=='struggle'){const slot=side==='p'&&mi!=null&&mi!=='struggle'?u.moves[mi]:u.moves.find(x=>x.id===id);if(slot)slot.pp=Math.max(0,slot.pp-1);}
  await bsay(`${bname(side)}의 ${mv.n}!`);
  if(mv.a&&rnd(100)>=mv.a){sfx('miss');await bsay(`그러나 ${bname(side)}의 공격은 빗나갔다!`);return;}
  if(mv.c==='x'){const fx=mv.fx;
    if(fx.status){const e=effT(mv.t,SP[t.sid].t);if(e===0||!canStatus(t,fx.status)){await animMove(side,mv,true);await bsay(t.st===fx.status?`${J(bname(ts),'은')} 이미 ${STATUS[fx.status].n} 상태다!`:'그러나 효과가 없었다...');return;}
      await animMove(side,mv);await inflict(ts,fx.status);return;}
    await animMove(side,mv);
    if(fx.foe)for(const[s,v]of fx.foe)await statChange(ts,s,v);
    if(fx.self)for(const[s,v]of fx.self)await statChange(side,s,v);return;}
  const r=dmgCalc(u,t,mv,B.st[side],B.st[ts]);
  if(r.e===0){await bsay(`${bname(ts)}에게는 효과가 없는 것 같다...`);return;}
  await animMove(side,mv);sfx(r.e>1?'super':r.e<1?'weak':'hit');await hitReact(ts,r.e);
  const before=t.hp;await animHP(ts,t,t.hp-r.d);const dealt=before-t.hp;
  if(r.crit)await bsay('급소에 맞았다!');if(r.e>1)await bsay('효과가 굉장했다!');else if(r.e<1)await bsay('효과가 별로인 듯하다...');
  if(mv.fx.drain&&u.hp>0&&dealt>0){const hh=Math.max(1,Math.floor(dealt*mv.fx.drain/100));sfx('absorb');await drainFx(ts,side);await animHP(side,u,u.hp+hh);await bsay(`${bname(ts)}에게서 체력을 흡수했다!`);}
  if(mv.fx.recoil&&dealt>0){const rr=Math.max(1,Math.floor((id==='struggle'?maxHp(u):dealt)*mv.fx.recoil/100));await animHP(side,u,u.hp-rr);await bsay(`${J(bname(side),'은')} 반동으로 데미지를 입었다!`);}
  if(t.hp>0){if(mv.fx.st&&chance(mv.fx.st[1])&&canStatus(t,mv.fx.st[0]))await inflict(ts,mv.fx.st[0]);
    if(mv.fx.stat){const[who,s,v,ch]=mv.fx.stat;if(chance(ch))await statChange(who==='foe'?ts:side,s,v);}
    if(mv.fx.flinch&&chance(mv.fx.flinch)&&!B.moved[ts])B.flinch[ts]=1;}
  if(t.hp<=0)await faint(ts);if(u.hp<=0)await faint(side);}
function dmgCalc(u,t,mv,us,ts){const su=calc(u),st=calc(t),ph=mv.c==='p';const crit=Math.random()<1/(mv.fx.crit?8:16);
  let A=ph?su[1]:su[3],D=ph?st[2]:st[4];const as=us[ph?1:3],ds=ts[ph?2:4];A*=crit?Math.max(1,mult(as)):mult(as);D*=crit?Math.min(1,mult(ds)):mult(ds);
  let d=Math.floor(Math.floor(Math.floor(2*u.lv/5+2)*mv.p*A/D)/50)+2;if(ph&&u.st==='brn')d=Math.floor(d/2);if(crit)d=Math.floor(d*1.5);
  d=Math.floor(d*(85+rnd(16))/100);const stab=SP[u.sid].t.includes(mv.t)?1.5:1,e=mv.id==='struggle'?1:effT(mv.t,SP[t.sid].t);
  d=Math.floor(d*stab*e);if(e>0)d=Math.max(1,d);return{d,e,crit};}
function canStatus(m,s){if(m.st||m.hp<=0)return false;const t=SP[m.sid].t;
  if(s==='psn'&&t.includes('poison'))return false;if(s==='brn'&&t.includes('fire'))return false;if(s==='par'&&t.includes('elec'))return false;return true;}
async function inflict(side,s){const m=SIDE(side);m.st=s;if(s==='slp')m.slp=1+rnd(3);updHud(side);await statusAnim(side,s);
  await bsay({psn:`${J(bname(side),'은')} 독에 걸렸다!`,brn:`${J(bname(side),'은')} 화상을 입었다!`,par:`${J(bname(side),'은')} 마비되어 기술이 나오기 어려워졌다!`,slp:`${J(bname(side),'은')} 잠들어 버렸다!`}[s]);}
async function statChange(side,s,v){const S=B.st[side],nm=bname(side);
  if((v>0&&S[s]>=6)||(v<0&&S[s]<=-6)){await bsay(`${nm}의 ${J(STN[s],'은')} 더 이상 ${v>0?'올라가지':'떨어지지'} 않는다!`);return;}
  S[s]=clamp(S[s]+v,-6,6);const c=center(side);sfx(v>0?'statup':'statdn');
  if(SET.anim){for(let i=0;i<10;i++)FX.add({x:c.x-22+rnd(44),y:c.y+(v>0?20:-20)+rnd(10),vy:v>0?-1.4:1.4,shape:'arrow',dn:v<0,c:v>0?'#ff7a4a':'#4a8aff',s:3,life:34});
    B[side].tint=v>0?'#ff9a6a':'#6a9aff';B[side].white=.45;await tween(500,k=>B[side].white=.45*(1-k));B[side].tint=null;}
  await bsay(`${nm}의 ${J(STN[s],'이')} ${Math.abs(v)>=2?'크게 ':''}${v>0?'올라갔다!':'떨어졌다!'}`);}
async function endTurn(){for(const side of['p','e']){const m=SIDE(side);if(!m||m.hp<=0)continue;
  if(m.st==='psn'||m.st==='brn'){await statusAnim(side,m.st);await animHP(side,m,m.hp-Math.max(1,Math.floor(maxHp(m)/8)));
    await bsay(`${J(bname(side),'은')} ${m.st==='psn'?'독':'화상'} 데미지를 입고 있다!`);if(m.hp<=0)await faint(side);}}}
async function faint(side){const m=SIDE(side),S=B[side];if(!S.show)return;cry(m.sid,{faint:1});await sleep(300);sfx('faint');
  if(side==='e'&&(B.wild||B.fi>=B.foe.length-1))Music.play('victory');
  await tween(420,k=>S.y=k*96,EASE.in);S.show=false;S.y=0;(side==='p'?hudP:hudE).classList.add('out');
  await bsay(`${J(bname(side),'은')} 쓰러졌다!`);if(side==='e')await gainExp();}

/* ---------- 연출 ---------- */
async function hitReact(side,e){const S=B[side];if(e>1){B.shake=4;setTimeout(()=>B.shake=0,260);}
  for(let i=0;i<4;i++){S.blink=!S.blink;await sleep(65);}S.blink=false;}
async function drainFx(from,to){const a=center(from),b=center(to);for(let i=0;i<12;i++){const t=24+rnd(10);FX.add({x:a.x+rnd(20)-10,y:a.y+rnd(20)-10,vx:(b.x-a.x)/t,vy:(b.y-a.y)/t,shape:'circ',c:i%2?'#9be07a':'#e8ffd0',s:2,life:t,fade:0});}await sleep(420);}

/* ---------- 기술 연출 ----------
   기술마다 고유한 모션(MOVE_FX). 없는 기술은 타입별 기본 연출(typeFx). */
async function animMove(side,mv,weak){if(!SET.anim){await sleep(180);return;}
  const f=MOVE_FX[mv.id];if(!f){await typeFx(side,mv,weak);return;}
  const ts=OTHER(side),c={side,ts,mv,U:center(side),T:center(ts),S:B[side],TS:B[ts],d:side==='p'?1:-1};
  try{await f(c);}finally{for(const k of['S','TS']){c[k].x=0;c[k].y=0;c[k].sx=1;c[k].sy=1;c[k].white=0;c[k].tint=null;c[k].alpha=1;}B.dim=0;B.shake=0;}}

    if(addMon(e)==='box')await bsay(`${J(N(e),'은')} 보관함으로 전송되었다!`,true);

/* ---------- 경험치 / 레벨업 / 기술 ---------- */
async function gainExp(){const f=fm(),parts=[...B.part].filter(m=>m.hp>0&&G.party.includes(m)&&m.lv<100);if(!parts.length)return;
  const base=SP[f.sid].x*f.lv/7*(B.wild?1:1.5);
  for(const m of parts){const g=Math.max(1,Math.floor(base/parts.length));await bsay(`${J(N(m),'은')} ${g} 경험치를 얻었다!`);await addExp(m,g,m===pm()&&B.p.show);}}
async function addExp(m,g,active){let left=g;
  while(left>0&&m.lv<100){const need=expFor(m.lv+1)-m.exp,add=Math.min(left,need);m.exp+=add;left-=add;
    if(active){setExp(m);const iv=setInterval(()=>sfx('exp'),70);await sleep(650);clearInterval(iv);}
    if(m.exp>=expFor(m.lv+1)){await levelUp(m,active);if(active)setExp(m,true);}}}
async function levelUp(m,active){const o=calc(m);m.lv++;const n=calc(m);m.hp=Math.min(n[0],m.hp+n[0]-o[0]);B&&B.lvUp.add(m);if(active)updHud('p');
  Music.jingle('level');await say(`${J(N(m),'은')} 레벨 ${J(m.lv,'로')} 올랐다!`,{keep:1});
  const box=el(TOP,'box lvbox',STN.map((s,i)=>`<div><span>${s}</span><span>+${n[i]-o[i]}</span></div>`).join(''));await waitA();
  box.innerHTML=STN.map((s,i)=>`<div><span>${s}</span><span>${n[i]}</span></div>`).join('');await waitA();box.remove();
  await learnMoves(m);}
async function learnMoves(m){for(const[l,id]of SP[m.sid].ls){if(l!==m.lv||m.moves.some(x=>x.id===id))continue;await learnMove(m,id);}}
async function learnMove(m,id){const nmv=MV[id].n;
  if(m.moves.length<4){m.moves.push({id,pp:MV[id].pp});Music.jingle('level');await say(`${J(N(m),'은')} 새로 ${J(nmv,'을')} 배웠다!`,{keep:1});return;}
  await say(`${J(N(m),'은')} 새로 ${J(nmv,'을')} 배우고 싶다...`,{keep:1});await say(`하지만 ${J(N(m),'은')} 기술을 4개까지만 기억할 수 있다!`,{keep:1});
  while(true){const r=await ask(`다른 기술을 잊게 하고 ${J(nmv,'을')} 배우게 하겠습니까?`,['예','아니오'],{keep:1});
    if(r===0){msg(`어느 기술을 잊게 하겠습니까?`);
      const btns=m.moves.map((x,j)=>{const d=MV[x.id];return{html:`<span class="mn">${d.n}</span><span class="mi"><span>${TYPES[d.t].n} · ${CATN[d.c]}</span><span>PP ${x.pp}/${d.pp}</span></span>`,x:4+(j%2)*126,y:4+Math.floor(j/2)*58,w:122,h:52,cls:'mvbtn'};});
      const d=MV[id];btns.push({html:`<span class="mn">${d.n}</span><span class="mi"><span>${TYPES[d.t].n} · 새 기술</span><span>위력 ${d.p||'-'}</span></span>`,x:4,y:124,w:180,h:52,cls:'mvbtn'});
      btns.push({html:'취소',x:190,y:124,w:62,h:52,cls:'dark'});
      const i=await panel(btns,{backdrop:true,bg:'linear-gradient(#4a5a88,#2a3358)',onOpen:h=>h.els.forEach((e,j)=>{if(j<5){const mv=j<4?MV[m.moves[j].id]:d;const c=TYPES[mv.t].c;e.style.background=`linear-gradient(${shade(c,.3)},${shade(c,-.1)})`;}})});
      hideMsg();if(i>=0&&i<4){const old=MV[m.moves[i].id].n;m.moves[i]={id,pp:MV[id].pp};
        await say(`하나, 둘... 뿅!`,{keep:1});await say(`${J(N(m),'은')} ${J(old,'을')} 깨끗이 잊었다!`,{keep:1});Music.jingle('level');await say(`그리고... ${J(N(m),'은')} 새로 ${J(nmv,'을')} 배웠다!`,{keep:1});return;}}
    const q=await ask(`그럼... ${J(nmv,'을')} 배우는 것을 포기하겠습니까?`,['예','아니오'],{keep:1});
    if(q===0){await say(`${J(N(m),'은')} 결국 ${J(nmv,'을')} 배우지 않았다!`,{keep:1});return;}}}

  if(res==='win'){Music.play('victory');
    if(!B.wild){B.etr.show=true;B.etr.x=130;hudE.classList.add('out');await tween(420,k=>B.etr.x=130*(1-k),EASE.out);
      await bsay(`${J(tn(),'과')}의 승부에서 이겼다!`,true);if(o.lose)await say(o.lose,{name:tn(),keep:1});
      const lastLv=B.foe[B.foe.length-1].lv,prize=TCLASS[o.cls].m*lastLv;G.money+=prize;await bsay(`${J(G.name,'은')} 상금으로 ${money(prize)}을 손에 넣었다!`,true);}}
  else if(res==='lose'){
    if(o.noLose){B.etr.show=true;B.etr.x=130;await tween(420,k=>B.etr.x=130*(1-k));if(o.winMsg)await say(o.winMsg,{name:tn(),keep:1});}
    else{await bsay(`${G.name}에게는 싸울 수 있는 몬스터가 없다!`,true);const lost=Math.floor(G.money/2);G.money-=lost;
      await bsay(B.wild?`${J(G.name,'은')} 허둥지둥 ${money(lost)}을 떨어뜨리고 말았다...`:`${J(G.name,'은')} 상금으로 ${money(lost)}을 건네주었다...`,true);await bsay('...... 눈앞이 캄캄해졌다!',true);}}
  await fadeTo(1);
  [hudE,hudP,$('#bre'),$('#brp')].forEach(e=>e&&e.remove());hudE=hudP=null;hideMsg();FX.list=[];

    await say('몬스터들이 기운을 되찾았다! 무리하지 말고 다시 원정을 떠나자.');return res;}

/* ---------- 진화 ---------- */

    if(i%3===0){const a=Math.random()*7;for(let j=0;j<8;j++)FX.add({x:128+Math.cos(a+j)*90,y:80+Math.sin(a+j)*70,vx:-Math.cos(a+j)*3,vy:-Math.sin(a+j)*2.4,shape:'star',c:'#fff8b0',s:2,life:30});}sfx('cur');}
  popH(h);
  if(cancel){EV.sid=from;EV.scale=1;await tween(400,k=>EV.white=1-k);cry(from);await say(`어라...? ${oldName}의 변화가 멈췄다!`,{keep:1});}
  else{EV.sid=to;EV.scale=1.1;await tween(250,k=>EV.flash=k);const o=calc(m);m.sid=to;const n=calc(m);m.hp=Math.min(n[0],m.hp+n[0]-o[0]);G.seen[to]=G.caught[to]=1;
    EV.white=0;await tween(450,k=>EV.flash=1-k);cry(to);FX.burst(128,80,24,{c:['#fff8b0','#ffffff','#9fd8ff'],shape:'star',s:3,life:40,sp:3});await Music.jingle('evolved');
    await say(`축하합니다! ${J(oldName,'은')} ${J(SP[to].n,'로')} 진화했다!`,{keep:1});await learnMoves(m);}
  await fadeTo(1);hideMsg();EV=null;state='world';Pad.show();Music.play(curMap().music);await fadeTo(0);}
function drawEvolve(g){const gr=g.createRadialGradient(128,90,10,128,90,180);gr.addColorStop(0,'#3a4a8a');gr.addColorStop(1,'#080a18');g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.save();g.translate(128,80);g.rotate((frame-EV.f0)/80);for(let i=0;i<12;i++){g.rotate(Math.PI/6);g.fillStyle=i%2?'rgba(255,216,74,.09)':'rgba(127,184,255,.09)';g.beginPath();g.moveTo(0,0);g.lineTo(-16,-200);g.lineTo(16,-200);g.fill();}g.restore();

/* ---------- 최후의 수단: 트레이너가 직접 싸운다 ----------
   몬스터가 모두 쓰러지면 한 번, 트레이너가 직접 나설 수 있다. 쓰러지면 평소처럼 패배. */
const HERO_ACT=[{n:'돌 던지기',acc:92,lo:.16,hi:.24,d:'안정적'},{n:'몸통 박치기',acc:72,lo:.28,hi:.4,d:'위력 높음'}];
async function heroStart(){B.heroUsed=1;
  const r=await ask(`${G.name}의 몬스터가 모두 쓰러졌다!\n마지막으로 ${J(G.name,'이')} 직접 맞서 볼까?`,['직접 맞선다!','포기한다'],{keep:1});
  if(r!==0)return false;
  const lv=Math.max(...G.party.map(m=>m.lv)),max=20+lv*3;B.hero={lv,max,hp:max};
  hudP.querySelector('.exp').style.visibility='hidden';heroHud();
  B.ptr.show=true;B.ptr.x=-130;sfx('run');await tween(420,k=>B.ptr.x=-130*(1-k),EASE.out);hudP.classList.remove('out');
  await bsay(`${J(G.name,'은')} 쓰러진 몬스터들 앞을 막아섰다!`,true);
  await bsay(`${tnOrWild()} 앞에 ${J(G.name,'이')} 직접 맞선다!`);
  return true;}
const tnOrWild=()=>B.wild?`야생 ${N(fm())}`:N(fm());
function heroHud(hp){const h=B.hero,v=hp==null?h.hp:hp,p=clamp(v/h.max*100,0,100);
  hudP.querySelector('.nm').textContent=G.name;hudP.querySelector('.lv').innerHTML=`<span class="stb" style="background:#e2566f">트레이너</span>`;
  const bar=hudP.querySelector('.hpb i');bar.style.width=p+'%';bar.style.background=hpColor(p);hudP.querySelector('.hpt').textContent=`${Math.max(0,Math.ceil(v))} / ${h.max}`;}
async function heroHP(to){const h=B.hero,from=h.hp;to=clamp(Math.round(to),0,h.max);h.hp=to;await tween(Math.min(900,300+Math.abs(from-to)/h.max*700),k=>heroHud(from+(to-from)*k));heroHud();}
async function heroTurn(){const f=fm(),h=B.hero;
  msg(`${J(G.name,'은')}\n어떻게 맞설까?`);
  const heal=['super','potion'].find(k=>G.bag[k]>0);
  const btns=[...HERO_ACT.map((a,i)=>({html:`<span class="mn">${a.n}</span><span class="mi"><span>${a.d}</span><span>명중 ${a.acc}</span></span>`,x:4+i*126,y:6,w:122,h:62,cls:'mvbtn hero'})),
    {html:heal?`<span>${ITEMS[heal].n} 마시기</span><small>남은 ${G.bag[heal]}개</small>`:'<span>회복약 없음</span>',x:4,y:74,w:122,h:56,cls:'yellow',disabled:!heal},
    {html:B.wild?'<span>도망치다</span>':'<span>버티기</span><small>방어 자세</small>',x:130,y:74,w:122,h:56,cls:'blue'}];
  guideSoon('hero','#botUI .mvbtn','몬스터가 모두 쓰러져서 <b>트레이너가 직접</b> 싸우고 있어요! 트레이너가 쓰러지면 패배예요.',{title:'최후의 수단'});
  const i=await panel(btns,{cancel:false,onOpen:hh=>hh.els.slice(0,2).forEach(e=>{e.style.background='linear-gradient(#ffb08a,#d8603a)';e.style.borderColor='#7a2a10';})});
  hideMsg();let guard=false;
  if(i<2){const a=HERO_ACT[i];await bsay(`${J(G.name,'은')} ${J(a.n,'을')} 했다!`);
    // 연출: 돌 던지기 = 포물선, 몸통 박치기 = 돌진
    const c=center('e');
    if(i===0){sfx('throw');await tween(380,k=>{FX.add({x:40+(c.x-40)*k,y:150-(150-c.y)*k-Math.sin(k*Math.PI)*40,shape:'circ',c:'#8a7a6a',s:3,life:3});});}
    else{sfx('run');await tween(240,k=>B.ptr.x=k*60);await tween(160,k=>B.ptr.x=60*(1-k));}
    if(rnd(100)<a.acc){const mx=maxHp(f),dmg=Math.max(1,Math.round(mx*(a.lo+Math.random()*(a.hi-a.lo))));sfx('hit');await hitReact('e',1);await animHP('e',f,f.hp-dmg);
      if(i===1&&Math.random()<.35){await bsay(`반동으로 ${G.name}도 조금 다쳤다!`);await heroHP(h.hp-Math.round(h.max*.06));}}
    else{sfx('miss');await bsay(`하지만 ${tnOrWild()}에게 빗나갔다!`);}}
  else if(i===2&&heal){G.bag[heal]--;await bsay(`${J(G.name,'은')} ${J(ITEMS[heal].n,'을')} 꿀꺽 마셨다!`);sfx('heal');await heroHP(h.hp+Math.round(h.max*(heal==='super'?.6:.35)));}
  else{if(B.wild){if(Math.random()<.6){sfx('run');await bsay('몬스터들을 안고 무사히 도망쳤다!',true);return'run';}await bsay('도망칠 수 없었다!');}
    else{guard=true;await bsay(`${J(G.name,'은')} 몸을 웅크리고 버틴다!`);}}
  // 상대가 쓰러졌는지
  if(f.hp<=0){await faint('e');
    if(!B.wild&&B.fi<B.foe.length-1){B.fi++;await bsay(`${J(G.name,'은')} 숨을 고른다...`);await sendFoe();return null;}
    await bsay(`${J(G.name,'이')} 직접 승리를 거머쥐었다!`,true);return'win';}
  // 상대의 반격
  const id=aiHeroMove(f),mv=MV[id];await bsay(`${tnOrWild()}의 ${mv.n}!`);
  if(SET.anim)await animMove('e',mv,false);
  const pw=mv.p||40,raw=h.max*(.1+pw/650)*(.85+Math.random()*.3)*(f.lv/Math.max(1,h.lv))**.5*(guard?.4:1);
  if(rnd(100)<(mv.a||100)){sfx('hit');B.shake=5;setTimeout(()=>B.shake=0,260);await heroHP(h.hp-Math.max(1,Math.round(raw)));}
  else{sfx('miss');await bsay(`${J(G.name,'은')} 몸을 날려 피했다!`);}
  if(h.hp<=0){sfx('faint');await tween(400,k=>B.ptr.x=-k*130);B.ptr.show=false;hudP.classList.add('out');await bsay(`${J(G.name,'은')} 힘이 다해 쓰러졌다...`,true);return'lose';}
  return null;}
function aiHeroMove(e){const av=e.moves.filter(x=>x.pp>0&&MV[x.id].p);return av.length?av[rnd(av.length)].id:e.moves[0].id;}

/* =========================================================
   world.js — 필드 이동, 이벤트 도우미, 타이틀·오프닝·엔딩, 메인 루프
   ========================================================= */
let G=null,state='boot',busy=false,frame=0,transFx=null;
const P={x:0,y:0,tx:0,ty:0,dir:'down',moving:false,t:0,step:0,run:false,jump:false,turnAt:0,chain:false,emote:null};
const DV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const OPP={up:'down',down:'up',left:'right',right:'left'};
const curMap=()=>MAPS[G.map];
const npcOn=n=>!n.hide&&(!n.cond||n.cond());
const npcsOf=m=>m.npcs.filter(npcOn);
const npcById=id=>curMap().npcs.find(n=>n.id===id);
function npcAt(m,x,y){return npcsOf(m).find(n=>(n.x===x&&n.y===y)||(n.mv&&n.mx===x&&n.my===y));}
const itemAt=(m,x,y)=>m.items.find(i=>i.x===x&&i.y===y&&!G.flags[i.flag]);
function passable(m,x,y,dir){const c=tileAt(m,x,y);if(c==null)return false;if(m.out){if(c==='L')return dir==='down';return'.,=fQD:'.includes(c);}return'.cm'.includes(c);}

/* ---------- 이벤트 도우미 ---------- */
async function walkNpc(n,dirs,ms=240){for(const d of dirs){n.dir=d;const[dx,dy]=DV[d];n.mv=1;n.mx=n.x+dx;n.my=n.y+dy;n.walk=1;
    await tween(ms,k=>n.off=k*T);n.x+=dx;n.y+=dy;n.off=0;n.mv=0;n.walk=0;}}
async function walkPlayer(dirs,ms=230){for(const d of dirs){P.dir=d;const[dx,dy]=DV[d];P.tx=P.x+dx;P.ty=P.y+dy;P.moving=true;P.scripted=true;
    await tween(ms,k=>P.t=k);P.x=P.tx;P.y=P.ty;P.t=0;P.moving=false;P.scripted=false;P.step^=1;}G.x=P.x;G.y=P.y;}
async function emoteOn(n,kind='!',ms=650){(n==='player'?P:n).emote=kind;if(kind==='!')sfx('sel');await sleep(ms);(n==='player'?P:n).emote=null;}
function healParty(){G.party.forEach(healMon);}
function addMon(m){if(G.party.length<6){G.party.push(m);return'party';}m.boxAt=Date.now();G.box.push(m);return'box';}
async function giveItem(id,n=1,o={}){const it=ITEMS[id];G.bag[id]=(G.bag[id]||0)+n;await Music.jingle(it.p==='key'?'key':'item');
  await say(`${J(G.name,'은')} ${n>1?`${it.n} ${n}개를`:J(it.n,'을')} 손에 넣었다!`);
  if(it.p!=='key')await say(`${J(G.name,'은')} ${J(it.n,'을')} 가방의 ${POCKETS.find(p=>p[0]===it.p)[1]} 주머니에 넣었다.`);}
async function nicknamePrompt(m){const r=await ask(`${SP[m.sid].n}에게 이름을 붙여 주시겠습니까?`,['예','아니오']);
  if(r!==0)return;const v=await nameInput({title:`${SP[m.sid].n}의 이름은?`,def:'',max:6,allowEmpty:true,sug:[]});if(v&&v!==SP[m.sid].n)m.nick=v;}
async function runScript(fn){busy=true;try{await fn();}catch(e){console.error(e);}finally{busy=false;hideMsg();}}

/* ---------- 지도 이동 ---------- */
function enterMap(id,x,y,dir,o={}){const prev=G.map;G.map=id;const m=MAPS[id];
  P.x=P.tx=x;P.y=P.ty=y;P.moving=false;P.t=0;P.jump=false;if(dir)P.dir=dir;G.x=x;G.y=y;
  m.npcs=m.npcs.filter(n=>!n.tmp);for(const n of m.npcs){n.x=n.x0;n.y=n.y0;n.dir=n.d0;n.off=0;n.mv=0;n.walk=0;n.emote=null;n.wt=60+rnd(120);n.hide=false;}
  m.healAnim=null;Music.play(m.music);if(!o.quiet&&(MAPS[prev]?.name!==m.name||o.sign))showSign(m.name);if(state==='world')Pad.render();}
async function doWarp([to,x,y,dir],door){busy=true;sfx(door?'door':'exit');await fadeTo(1,'top');enterMap(to,x,y,dir);await sleep(60);await fadeTo(0,'top');busy=false;checkTrig();}
async function edgeWarp(to,side){busy=true;const m2=MAPS[to];let x=P.x,y=P.y;
  if(side==='n')y=m2.h-1;if(side==='s')y=0;if(side==='e')x=0;if(side==='w')x=m2.w-1;
  await fadeTo(1,'top');enterMap(to,x,y,P.dir);await fadeTo(0,'top');busy=false;}
function checkTrig(){const m=curMap();for(const t of m.trig){if(P.x>=t.x&&P.x<t.x+t.w&&P.y>=t.y&&P.y<t.y+t.h&&(!t.cond||t.cond())){runScript(t.run);return true;}}return false;}

/* ---------- 필드 업데이트 ---------- */
function updateWorld(dt){const m=curMap();if(!busy&&!ui.length&&!P.moving&&SET.tips)worldGuides();
  /* NPC 배회 */
  if(!busy&&!ui.length)for(const n of npcsOf(m)){if(!n.wander||n.mv)continue;if(--n.wt>0)continue;n.wt=90+rnd(180);
    const d=['up','down','left','right'][rnd(4)],[dx,dy]=DV[d],nx=n.x+dx,ny=n.y+dy;n.dir=d;
    if(Math.abs(nx-n.x0)>2||Math.abs(ny-n.y0)>2||!passable(m,nx,ny,d)||'DLm'.includes(tileAt(m,nx,ny))||npcAt(m,nx,ny)||itemAt(m,nx,ny)||(nx===P.x&&ny===P.y)||(nx===P.tx&&ny===P.ty))continue;
    walkNpc(n,[d],380);}
  if(P.moving&&!P.scripted){const sp=P.jump?2.4:P.run?8.2:4.4;P.t+=dt*sp;if(P.t>=1){P.x=P.tx;P.y=P.ty;P.moving=false;P.t=0;P.step^=1;P.chain=!!dirStack.length;onStep();}return;}
  if(busy||ui.length||P.scripted)return;
  const now=performance.now(),hd=dirStack[dirStack.length-1],tp=tapDir;tapDir=null;const d=hd||tp;
  if(!d){P.chain=false;return;}
  if(d!==P.dir&&!P.chain){P.dir=d;P.turnAt=now;return;}
  if(hd&&now-P.turnAt<90&&!P.chain)return;
  tryMove(d);}
let lastBump=0;
function tryMove(d){const m=curMap();P.dir=d;const[dx,dy]=DV[d],nx=P.x+dx,ny=P.y+dy;
  if(nx<0||ny<0||nx>=m.w||ny>=m.h){const side={up:'n',down:'s',left:'w',right:'e'}[d];if(m.links&&m.links[side])edgeWarp(m.links[side],side);return;}
  const c=tileAt(m,nx,ny);
  if(m.out&&c==='L'&&d==='down'){const ly=ny+1;if(passable(m,nx,ly,'down')&&!npcAt(m,nx,ly)&&!itemAt(m,nx,ly)){P.tx=nx;P.ty=ly;P.moving=true;P.jump=true;P.t=0;sfx('jump');}return;}
  if(!passable(m,nx,ny,d)||npcAt(m,nx,ny)||itemAt(m,nx,ny)){if(frame-lastBump>18){sfx('bump');lastBump=frame;}P.chain=false;return;}
  P.tx=nx;P.ty=ny;P.moving=true;P.t=0;P.run=held.b&&!!G.flags.shoes;}
function onStep(){const m=curMap();G.x=P.x;G.y=P.y;G.steps=(G.steps||0)+1;
  if(P.jump){P.jump=false;sfx('land');}
  const w=m.warps[P.x+','+P.y];if(w){doWarp(w,tileAt(m,P.x,P.y)==='D');return;}
  if(checkTrig())return;
  const tr=sightCheck(m);if(tr){runScript(()=>trainerSpot(tr));return;}
  if(tileAt(m,P.x,P.y)===','){m.rustle={x:P.x,y:P.y,f:frame};if(m.enc&&G.party.some(p=>p.hp>0)&&Math.random()<.11)runScript(()=>wildEncounter(m));}
  if(Pad.app===3&&G.steps%5===0)Pad.render();}
function sightCheck(m){for(const n of npcsOf(m)){const live=(n.trainer&&!G.flags[n.id])||(n.sight&&!n.trainer);if(!live)continue;const[dx,dy]=DV[n.dir];

function camera(){const m=curMap(),k=P.moving?P.t:0,px=lerp(P.x,P.tx,k)*T,py=lerp(P.y,P.ty,k)*T;
  let cx=Math.round(px+8-W/2),cy=Math.round(py+8-H/2);
  cx=m.w*T<=W?Math.round((m.w*T-W)/2):clamp(cx,0,m.w*T-W);cy=m.h*T<=H?Math.round((m.h*T-H)/2):clamp(cy,0,m.h*T-H);return{cx,cy,px,py};}

function drawWorld(g){const m=curMap(),{cx,cy,px,py}=camera();R('#000',0,0,W,H,g);
  const x0=Math.floor(cx/T),y0=Math.floor(cy/T);
  for(let ty=y0;ty<=y0+Math.ceil(H/T);ty++)for(let tx=x0;tx<=x0+Math.ceil(W/T);tx++){const sx=tx*T-cx,sy=ty*T-cy;
    if(m.out)drawTileOut(m,tx,ty,sx,sy);else if(tileAt(m,tx,ty)==null)R('#000',sx,sy,16,16,g);else drawTileIn(m,tx,ty,sx,sy);}
  for(const it of m.items)if(!G.flags[it.flag])capsule(g,it.x*T-cx+8,it.y*T-cy+10,0,{kind:it.item==='great'?'great':'ball'});
  if(m.id==='lab')for(const[sx0,sy0,sid]of STARTERS)if(!G.flags.starter||(sid!==G.starter&&sid!==G.rivalStarter))capsule(g,sx0*T-cx+8,sy0*T-cy+7);
  if(m.healAnim){const hx=4*T-cx,hy=2*T-cy;for(let i=0;i<m.healAnim.n;i++){const bx=hx+3+(i%3)*5,by=hy+4+Math.floor(i/3)*4;R(m.healAnim.blink&&(frame>>3)&1?'#ffffff':'#ffd84a',bx,by,3,3,g);}}
  const ents=[];

    ents.push({y:n.y*T+dy*off,f:()=>{const sx=Math.round(n.x*T+dx*off-cx),sy=Math.round(n.y*T+dy*off-cy)-6;
      person(g,sx,sy+(n.bow?1:0),n.dir,n.walk?((frame>>3)&1)+1:0,LOOK[n.look]||LOOK.man);grassOver(g,m,n.x,n.y,sx,sy);if(n.emote)emote(g,sx,sy,n.emote);}});}
  if(!P.hidden)ents.push({y:py+.5,f:()=>{const k=P.moving?P.t:0,jy=P.jump?-Math.sin(Math.PI*k)*10:0,sx=Math.round(px-cx),sy=Math.round(py-cy)-6+Math.round(jy);

    const fr=P.moving?(P.t<.5?(P.step?2:1):0):0;person(g,sx,sy,P.dir,fr,LOOK.player);
    if(!P.moving)grassOver(g,m,P.x,P.y,sx,sy);else if(P.t>.5)grassOver(g,m,P.tx,P.ty,sx,sy);if(P.emote)emote(g,sx,sy,P.emote);}});
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.f());
  if(m.out){const h=new Date().getHours();const t=h>=20||h<4?'rgba(20,30,90,.33)':h>=17?'rgba(255,120,40,.13)':h<7?'rgba(255,190,150,.1)':null;if(t){g.fillStyle=t;g.fillRect(0,0,W,H);}}}

      if(g){const c=await ask(`${g.name}의 모험(배지 ${(g.badges||[]).filter(Boolean).length} · 도감 ${Object.keys(g.caught||{}).length})을 불러올까요?${sv?' 이 기기의 기존 리포트는 덮어써집니다.':''}`,['불러오기','그만두기']);
        if(c===0){await startFromCode(g,lg);return;}}}
    const btns=[{html:sv?`<div style="font-size:${U(12)}">이어하기</div><small>${esc(sv.name)} · 배지 ${(sv.badges||[]).filter(Boolean).length} · 도감 ${Object.keys(sv.caught||{}).length} · ${fmtTime(sv.playMs||0)}</small>`:'<div style="font-size:'+U(12)+'">이어하기</div><small>리포트 없음</small>',x:20,y:16,w:216,h:56,cls:'blue',disabled:!sv},
      {html:`<div style="font-size:${U(12)}">처음부터 시작</div>`,x:20,y:78,w:216,h:36},{html:'<div>코드로 불러오기</div><small>다른 기기에서 이어 하기</small>',x:20,y:120,w:216,h:36,cls:'purple'},{html:'설정',x:20,y:162,w:216,h:24,cls:'dark'}];
    const i=await panel(btns,{start:sv?0:1,cancel:false});
    if(i===3){await optionsMenu();continue;}
    if(i===2){const g=await inputSaveCode();if(!g)continue;
      if(sv){const c=await ask(`${g.name}의 모험(배지 ${(g.badges||[]).filter(Boolean).length} · 도감 ${Object.keys(g.caught||{}).length})을 불러옵니다. 이 기기의 기존 리포트는 덮어써집니다. 괜찮습니까?`,['불러오기','돌아가기'],{start:1});if(c!==0)continue;}
      await startFromCode(g,lg);return;}
    if(i===1&&sv){const c=await ask('기존 리포트가 있습니다. 처음부터 시작하면 리포트를 저장할 때 덮어쓰게 됩니다. 괜찮습니까?',['처음부터 시작','돌아가기'],{start:1});if(c!==0)continue;}
    lg.remove();await fadeTo(1);
    if(i===0){G=sv;G.flags=G.flags||{};G.badges=G.badges||[0,0];busy=true;state='world';enterMap(G.map,G.x,G.y,G.dir||'down',{sign:1});Pad.show();await fadeTo(0);busy=false;return;}
    await intro();return;}}

Pad.init();requestAnimationFrame(loop);titleScreen();

/* 필드에서 처음 하는 일 안내 */
function worldGuides(){const touch=matchMedia('(pointer:coarse)').matches;
  if(!guideSeen('move'))return guide('move','top',touch?'아래 <b>원형 패드</b>로 걸어 다닐 수 있어요. 짧게 누르면 방향만 바뀌어요.<br>사람이나 물건 앞에서 <b>A</b>를 누르면 말을 걸거나 조사해요.':'<b>방향키</b>로 걸어 다닐 수 있어요. 짧게 누르면 방향만 바뀌어요.<br>사람이나 물건 앞에서 <b>Z</b>를 누르면 말을 걸거나 조사해요.',{title:'이동과 조사'});
  if(G.flags.pad&&!guideSeen('menu')&&document.querySelector('#padUI .btn.red'))return guide('menu','#padUI .btn.red',`여기서 <b>메뉴</b>를 열어요. 도감·몬스터·가방·리포트(저장)·설정이 들어 있어요.${touch?'':' 키보드는 <b>Enter</b>.'}`,{title:'메뉴'});
  if(G.flags.pad&&!guideSeen('padapp')&&document.querySelector('#padUI .nav'))return guide('padapp','#padUI .lcd',`원정패드의 <b>◀ ▶</b>로 시계 · 파티 · 지도 · 만보기 앱을 바꿔 볼 수 있어요.${touch?'':' 키보드는 <b>Q / E</b>.'}`,{title:'원정패드'});
  if(G.flags.shoes&&!guideSeen('run'))return guide('run','top',`<b>B${touch?'':'(X)'}</b>를 누른 채로 이동하면 질주신발로 빠르게 달릴 수 있어요.`,{title:'달리기'});
  if(G.flags.badge0&&!guideSeen('fuse'))return guide('fuse','top','몬스터 두 마리를 합치면 <b>한 단계 위 등급</b>의 무작위 타입 몬스터가 돼요. <b>메뉴 → 몬스터 → 합성하기</b>나 몬스터 센터의 합성 연구원에게서 할 수 있어요.',{title:'몬스터 합성'});}

</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14161f">
<meta name="description" content="오리지널 몬스터를 모으고 키우는 2화면 턴제 RPG — 브라우저에서 바로 플레이">
<title>몬스터 원정대</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
/*CSS*/
</style>
</head>
<body>
<div id="app">
  <div id="ds">
    <div class="bezel" id="bzTop">
      <div class="scr" id="scrTop">
        <canvas id="top" width="1024" height="768"></canvas>
        <div class="ov" id="topUI"></div>
        <div class="fade" id="fadeTop"></div>
      </div>
    </div>
    <div id="hinge"><i></i><i></i></div>
    <div class="bezel" id="bzBot">
      <div class="scr" id="scrBot">
        <canvas id="bot" width="1024" height="768"></canvas>
        <div class="ov" id="botUI"></div>
        <div class="fade" id="fadeBot"></div>
      </div>
    </div>
  </div>
  <div id="pad">
    <div class="cpad" id="cpad" aria-label="방향 패드"><i class="ar up">▲</i><i class="ar down">▼</i><i class="ar left">◀</i><i class="ar right">▶</i><b class="knob"></b></div>
    <div class="mid"><button data-k="menu" class="pill">MENU</button></div>
    <div class="ab"><button data-k="b">B</button><button data-k="a">A</button></div>
  </div>
  <div id="help"><b>방향키</b> 이동 · <b>Z</b> 확인 · <b>X</b> 취소(누른 채 이동하면 달리기) · <b>Enter</b> 메뉴 · <b>Q</b>/<b>E</b> 패드 앱 전환 · <b>M</b> 소리</div>
</div>
<script>
/*JS*/
</script>
</body>
</html>

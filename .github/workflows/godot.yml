# 몬스터 원정대 Godot 판
#  - build: Godot 4.7.2로 웹 빌드 + 안드로이드 APK·AAB(Gradle 빌드, targetSdk 36, arm64·x86_64) 내보내기
#           targetSdk·16KB 정렬·서명을 검사하고 아티팩트로 올림
#  - emulator-test: Android 16 에뮬레이터에 설치해 실행 확인
#  - windows-package: 윈도우 러너에서 실행 확인(헤드리스) 후 Microsoft Store용 MSIX와 zip 만들기
#             MSIX 패키지 ID는 저장소 Variables(MSIX_IDENTITY_NAME·MSIX_PUBLISHER·MSIX_PUBLISHER_DISPLAY_NAME)로 정함
#  - release: main 브랜치면 "godot-번호" 사전 출시(prerelease)로 게시 (기존 WebView 앱 릴리스는 그대로 최신 유지)
#             수동 실행(workflow_dispatch)에서 tag를 주면 그 릴리스의 설명문과 파일을 새로 고친다
name: Godot

on:
  push:
    paths:
      - 'godot/**'
      - '.github/workflows/godot.yml'
      - 'store/msix/**'
  pull_request:
    paths:
      - 'godot/**'
      - '.github/workflows/godot.yml'
      - 'store/msix/**'
  workflow_dispatch:
    inputs:
      tag:
        description: '고쳐 쓸 기존 릴리스 태그 (예: godot-9). 비우면 새 godot-번호 릴리스'
        required: false
        default: ''

concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Godot·내보내기 템플릿 설치
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$GODOT_VERSION
          cd "$RUNNER_TEMP"
          gh release download "$V-stable" --repo godotengine/godot-builds \
            --pattern "Godot_v$V-stable_linux.x86_64.zip" --pattern "Godot_v$V-stable_export_templates.tpz"
          unzip -q "Godot_v$V-stable_linux.x86_64.zip"
          echo "GODOT=$RUNNER_TEMP/Godot_v$V-stable_linux.x86_64" >> "$GITHUB_ENV"
          T="$HOME/.local/share/godot/export_templates/$V.stable"
          mkdir -p "$T"
          unzip -q "Godot_v$V-stable_export_templates.tpz" -d tpl
          mv tpl/templates/* "$T/"
          ls "$T"

      - name: Android SDK (플랫폼 36)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.7.tres

      - name: 서명 키 준비
        env:
          KEYSTORE_B64: ${{ secrets.ME_KEYSTORE_BASE64 }}
          ME_KEYSTORE_PASSWORD: ${{ secrets.ME_KEYSTORE_PASSWORD }}
          ME_KEY_ALIAS: ${{ secrets.ME_KEY_ALIAS }}
          ME_KEY_PASSWORD: ${{ secrets.ME_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "::notice::PR 검증은 디버그 키를 사용합니다."
              exit 0
            fi
            echo "::error::배포 빌드는 기존 업데이트 서명 키가 필요합니다."
            exit 1
          fi
          K="$RUNNER_TEMP/godot-release.jks"
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$K"
          # Godot는 저장소 비밀번호 하나로 키도 연다: 키 비밀번호가 다르면 임시 사본에서 맞춘다
          if [ -n "$ME_KEY_PASSWORD" ] && [ "$ME_KEY_PASSWORD" != "$ME_KEYSTORE_PASSWORD" ]; then
            keytool -keypasswd -keystore "$K" -storepass "$ME_KEYSTORE_PASSWORD" -alias "$ME_KEY_ALIAS" \
              -keypass "$ME_KEY_PASSWORD" -new "$ME_KEYSTORE_PASSWORD"
          fi
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$K"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$ME_KEY_ALIAS"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$ME_KEYSTORE_PASSWORD"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$ME_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: 내보내기 (웹·APK·AAB·Windows)
        run: |
          cd godot
          # 버전 코드: 빌드 시각(분) — 매번 커진다
          CODE=$(( ($(date +%s) - 1700000000) / 60 ))
          sed -i "s/^version\/code=.*/version\/code=$CODE/; s/^version\/name=.*/version\/name=\"4.0 ($(git rev-parse --short HEAD))\"/" export_presets.cfg
          mkdir -p build/web build/android
          "$GODOT" --headless --path . --import > /dev/null 2>&1 || true
          "$GODOT" --headless --path . res://tests/regression.tscn > regression.log 2>&1
          cat regression.log
          grep -q GODOT_REGRESSION_PASS regression.log
          ! grep -E 'SCRIPT ERROR:|Shader compilation failed' regression.log
          "$GODOT" --headless --path . res://tests/new_survey.tscn > new-survey.log 2>&1
          cat new-survey.log
          grep -q NEW_SURVEY_PASS new-survey.log
          ! grep -E 'SCRIPT ERROR:|Shader compilation failed' new-survey.log
          "$GODOT" --headless --path . --export-release "Web" build/web/index.html
          "$GODOT" --headless --path . --install-android-build-template --export-release "Android APK" build/android/monster-expedition-godot.apk
          "$GODOT" --headless --path . --export-release "Android AAB" build/android/monster-expedition-godot.aab
          # 에뮬레이터 테스트 전용(x86_64) — 배포하지 않음
          "$GODOT" --headless --path . --export-release "Android APK Test" build/android/test-x86_64.apk
          # Windows(Microsoft Store용): exe에 데이터 내장. 아이콘 넣기가 실패하면 아이콘 없이 다시 내보낸다
          mkdir -p build/windows
          sed -i "s/^application\/file_version=.*/application\/file_version=\"4.0.$GITHUB_RUN_NUMBER.0\"/; s/^application\/product_version=.*/application\/product_version=\"4.0.$GITHUB_RUN_NUMBER.0\"/" export_presets.cfg
          if ! "$GODOT" --headless --path . --export-release "Windows Desktop" build/windows/VeloriaFieldnotes.exe; then
            echo "::warning::exe 아이콘 넣기 실패 — 아이콘 없이 다시 내보냄"
            sed -i 's/^application\/modify_resources=true/application\/modify_resources=false/' export_presets.cfg
            "$GODOT" --headless --path . --export-release "Windows Desktop" build/windows/VeloriaFieldnotes.exe
          fi
          test -s build/windows/VeloriaFieldnotes.exe
          ls -la build/web build/android build/windows
          test -s build/web/index.wasm
          test -s build/android/monster-expedition-godot.apk
          test -s build/android/monster-expedition-godot.aab
          test -s build/android/test-x86_64.apk
          echo "### 크기" >> "$GITHUB_STEP_SUMMARY"
          du -h build/android/*.apk build/android/*.aab build/windows/* | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

      - name: 검사 (targetSdk 36 · 16KB 정렬 · 서명)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK=godot/build/android/monster-expedition-godot.apk
          AAB=godot/build/android/monster-expedition-godot.aab
          "$BT/aapt2" dump badging "$APK" | grep -E "^package|sdkVersion|targetSdkVersion|native-code"
          "$BT/aapt2" dump badging "$APK" | grep -q "targetSdkVersion:'36'"
          # 배포용 APK는 휴대폰용(arm64)만
          "$BT/aapt2" dump badging "$APK" | grep -q "native-code: 'arm64-v8a'$"
          "$BT/zipalign" -c -P 16 -v 4 "$APK" | tail -3
          "$BT/apksigner" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)"
          gh release download --repo google/bundletool --pattern 'bundletool-all-*.jar' --output "$RUNNER_TEMP/bundletool.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle "$AAB" | head -20
          jarsigner -verify "$AAB" | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: godot-web
          path: godot/build/web
      - uses: actions/upload-artifact@v4
        with:
          name: godot-android
          path: |
            godot/build/android/monster-expedition-godot.apk
            godot/build/android/monster-expedition-godot.aab
      - uses: actions/upload-artifact@v4
        with:
          name: godot-android-test
          path: godot/build/android/test-x86_64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: godot-windows
          path: godot/build/windows

  windows-package:
    needs: build
    runs-on: windows-latest
    env:
      MSIX_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'chunghyun1995.VeloriaFieldnotes' }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=VeloriaFieldnotesDev' }}
      MSIX_PUBLISHER_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'chunghyun1995' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: store/msix
      - uses: actions/download-artifact@v4
        with:
          name: godot-windows
          path: win

      - name: 실행 확인 (헤드리스로 타이틀까지 켰다 끄기)
        run: |
          Get-ChildItem win | Format-Table Name, Length
          $out = & .\win\VeloriaFieldnotes.console.exe --headless --quit-after 900 2>&1 | Out-String
          $code = $LASTEXITCODE
          $out | Select-Object -Last 40
          if ($code -ne 0) { throw "종료 코드 $code" }
          if ($out -match 'SCRIPT ERROR|Parse Error') { throw "스크립트 오류" }

      - name: zip · MSIX 만들기
        run: |
          $v = "4.0.$env:GITHUB_RUN_NUMBER.0"
          New-Item -ItemType Directory -Force dist, layout, layout\Assets | Out-Null
          Get-ChildItem win -File | Where-Object { $_.Name -notlike '*.console.exe' } | Copy-Item -Destination layout
          Copy-Item store\msix\*.png layout\Assets
          Compress-Archive -Path (Get-ChildItem layout -File).FullName -DestinationPath dist\VeloriaFieldnotes-windows-x64.zip
          $manifest = @"
          <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
            xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
            xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities"
            IgnorableNamespaces="uap rescap">
            <Identity Name="$env:MSIX_NAME" Publisher="$env:MSIX_PUBLISHER" Version="$v" ProcessorArchitecture="x64" />
            <Properties>
              <DisplayName>벨로리아 생태기록</DisplayName>
              <PublisherDisplayName>$env:MSIX_PUBLISHER_NAME</PublisherDisplayName>
              <Logo>Assets\StoreLogo.png</Logo>
            </Properties>
            <Dependencies>
              <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.22621.0" />
            </Dependencies>
            <Resources>
              <Resource Language="ko-KR" />
            </Resources>
            <Applications>
              <Application Id="VeloriaFieldnotes" Executable="VeloriaFieldnotes.exe" EntryPoint="Windows.FullTrustApplication">
                <uap:VisualElements DisplayName="벨로리아 생태기록" Description="폭풍에 끊긴 관측망을 잇는 생태 조사 RPG"
                  BackgroundColor="transparent" Square150x150Logo="Assets\Square150x150Logo.png" Square44x44Logo="Assets\Square44x44Logo.png">
                  <uap:DefaultTile Wide310x150Logo="Assets\Wide310x150Logo.png" Square71x71Logo="Assets\Square71x71Logo.png" Square310x310Logo="Assets\Square310x310Logo.png" />
                </uap:VisualElements>
              </Application>
            </Applications>
            <Capabilities>
              <rescap:Capability Name="runFullTrust" />
            </Capabilities>
          </Package>
          "@
          Set-Content -Path layout\AppxManifest.xml -Value $manifest -Encoding utf8NoBOM
          # makeappx.exe가 실제로 있는 가장 새 SDK 폴더 (빈 옛 버전 폴더는 건너뜀)
          $kit = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            Sort-Object { $n = $null; if ([version]::TryParse($_.Directory.Parent.Name, [ref]$n)) { $n } else { [version]'0.0' } } -Descending | Select-Object -First 1 -ExpandProperty Directory
          if (-not $kit) { throw "makeappx.exe 없음" }
          & "$($kit.FullName)\makeappx.exe" pack /d layout /p dist\VeloriaFieldnotes.msix /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx 실패" }
          "KIT=$($kit.FullName)" | Out-File -Append $env:GITHUB_ENV
          Get-ChildItem dist | Format-Table Name, Length
          "### Windows`n- MSIX $v · $env:MSIX_NAME · $env:MSIX_PUBLISHER" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          if ($env:MSIX_PUBLISHER -eq 'CN=VeloriaFieldnotesDev') { "::warning::저장소 Variables에 MSIX_IDENTITY_NAME·MSIX_PUBLISHER·MSIX_PUBLISHER_DISPLAY_NAME가 없어 임시 ID로 만들었습니다(스토어 업로드 불가)." }

      - name: MSIX 설치 확인 (임시 인증서로 서명한 사본)
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $env:MSIX_PUBLISHER -CertStoreLocation Cert:\CurrentUser\My -TextExtension @("2.5.29.19={text}false")
          $pw = ConvertTo-SecureString -String "test" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath test.pfx -Password $pw | Out-Null
          Import-Certificate -FilePath (Export-Certificate -Cert $cert -FilePath test.cer).FullName -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Copy-Item dist\VeloriaFieldnotes.msix test.msix
          & "$env:KIT\signtool.exe" sign /fd SHA256 /f test.pfx /p test test.msix
          if ($LASTEXITCODE -ne 0) { throw "서명 실패" }
          Add-AppxPackage -Path test.msix
          $pkg = Get-AppxPackage -Name $env:MSIX_NAME
          if (-not $pkg) { throw "설치되지 않음" }
          $pkg | Format-List Name, Version, InstallLocation
          if (-not (Test-Path (Join-Path $pkg.InstallLocation "VeloriaFieldnotes.exe"))) { throw "설치 폴더에 exe 없음" }
          Remove-AppxPackage -Package $pkg.PackageFullName

      - uses: actions/upload-artifact@v4
        with:
          name: godot-windows-package
          path: dist

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: godot-android-test
          path: dist
      - name: KVM 사용
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r dist/test-x86_64.apk
            adb shell monkey -p io.github.chunghyun1995.monsterexpedition -c android.intent.category.LAUNCHER 1
            sleep 25
            adb shell pidof io.github.chunghyun1995.monsterexpedition
            adb logcat -d | grep -iE "godot|FATAL" | grep -iE "error|fatal|crash" | head -20 || true
            adb logcat -d | grep -q "FATAL EXCEPTION" && exit 1 || true
            adb exec-out screencap -p > shot.png
            python3 -c "import zlib,struct,sys;d=open('shot.png','rb').read();print('screenshot bytes',len(d))"
            adb logcat -d | grep -c "Program linking failed" || true
      - name: 화면이 비어 있지 않은지 확인
        run: |
          pip install -q pillow
          python3 - <<'PY'
          from PIL import Image, ImageStat
          im = Image.open('shot.png').convert('RGB')
          st = ImageStat.Stat(im)
          print('size', im.size, 'mean', [round(x) for x in st.mean], 'stddev', [round(x) for x in st.stddev])
          colors = len(set(im.resize((90, 160)).getdata()))
          print('colors', colors)
          assert colors > 200, '화면이 거의 단색입니다 (렌더링 실패 의심)'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-emulator-shot
          path: shot.png

  release:
    needs: [build, emulator-test, windows-package]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/original-expedition-release') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: godot-android
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: godot-windows-package
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || format('veloria-{0}', github.run_number) }}
          name: 벨로리아 생태기록 ${{ inputs.tag || format('veloria-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: |
            dist/monster-expedition-godot.apk
            dist/monster-expedition-godot.aab
            dist/VeloriaFieldnotes.msix
            dist/VeloriaFieldnotes-windows-x64.zip
          body: |
            **벨로리아 생태기록 / VELORIA FIELDNOTES** — Godot 판 (Android · Windows)

            이번 빌드
            - 대화 창 정리: 전투 진행 문장 대신 머리 위 효과 토스트(기술·빗나감·상성·상태·능력치·회복), 승패·보상은 가운데 배너
            - 전투 밖 "~했다" 서술은 위쪽 알림으로, 물건 받기 효과음·대사 제거, 연구소 첫 장비 3종은 한 번에
            - 획득·회복·레벨업 음악 제거: 물건 받기·첫 동료·관측 인증 효과음, 회복 음악(엄마·관측 캠프·탑), 레벨업 음악(레벨 달성·새 기술·보관함 훈련)
            - 첫 동료는 새 게임 시작 직후 마을에서 고르기, 애칭은 동료 메뉴의 "이름 바꾸기"
            - 전투 체력·레벨은 생물·사람 머리 위 체력바
            - 걸으면 나오던 조우 대신 '조사' 팻말 나무를 조사해 생물과 만나기, 한쪽 통행 턱 제거
            - 원정가는 말을 걸 때만 기록 비교(강제 대결 없음), 직업명·보상 방식 변경
            - 관측 캠프·보급소 건물 색과 문양 변경, 마을 건물 이름판
            - 자동전투는 전투마다 꺼진 상태로 시작(설정에서 켤 수 있음), Windows 창 크기 고정

            기본 구성
            - 폭풍 이후 관측망 복구 이야기, 생물 34종·인물 27종, 다섯 관측소와 무한의 탑
            - 새 악보의 BGM·효과음, 자동전투·자동 사냥·탑 자동 등반, 처음 쓰는 기능 안내

            APK는 휴대폰 설치용(arm64), AAB는 Google Play 콘솔 업로드용입니다.
            Windows: `VeloriaFieldnotes.msix`는 Microsoft Store(Partner Center) 업로드용, `VeloriaFieldnotes-windows-x64.zip`은 압축을 풀어 바로 실행하는 PC판입니다.
            Android 7.0 이상 · targetSdk 36 · 16KB 정렬·서명 검사·Android 16 실행 검증.
            기존 Android 패키지 ID와 업데이트 서명 키를 유지합니다.

            확인된 유사 표현을 수정한 빌드이며 법적 비침해 보증은 아닙니다.
            변경 및 출처 확인 범위: docs/ASSET_RECORD_2026-10-11.md, docs/SIMILARITY_AUDIT_2026-10-11.md
            커밋: ${{ github.sha }}

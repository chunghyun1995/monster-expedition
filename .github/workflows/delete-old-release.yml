# 한 번만 쓰는 정리 작업: 예전 릴리스 apk-19, apk-16과 그 태그 삭제. 실행한 뒤 이 파일은 지운다.
name: Delete old release

on:
  push:
    branches: [claude/monster-expedition-apk-s582te]
    paths: ['.github/workflows/delete-old-release.yml']

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases apk-19, apk-16 and their tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in apk-19 apk-16; do
            gh release delete "$tag" --repo "${{ github.repository }}" --cleanup-tag --yes
          done
          echo "남은 릴리스:"; gh release list --repo "${{ github.repository }}"
          echo "남은 태그:"; gh api "repos/${{ github.repository }}/tags" --jq '.[].name'

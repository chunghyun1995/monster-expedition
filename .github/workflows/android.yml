# 몬스터 원정대 안드로이드 APK
#  - build: index.html(웹 게임)을 담은 APK와 플레이 스토어 업로드용 AAB 빌드 → Actions 아티팩트로 올림
#  - emulator-test: Android 12 · 13 · 14 · 15 · 16 에뮬레이터에 설치해 실행 확인 (android/ci/emulator_test.py)
#  - release: 자동 게시 끔(플레이 스토어는 Godot 판을 올림, 패키지가 같음). Actions 탭에서 이 워크플로를 main으로
#             수동 실행(Run workflow)할 때만 GitHub Releases에 APK·AAB 게시
name: Android APK

on:
  push:
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 배포용 개인 서명 키(저장소 시크릿). 없으면 빌드를 멈춘다 — 다른 키로 서명된 APK가 올라가지 않게.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ME_KEYSTORE_BASE64 }}
          ME_KEYSTORE_PASSWORD: ${{ secrets.ME_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$ME_KEYSTORE_PASSWORD" ]; then
            echo "::error::저장소 시크릿 ME_KEYSTORE_BASE64·ME_KEYSTORE_PASSWORD·ME_KEY_ALIAS·ME_KEY_PASSWORD를 등록하세요 (README '서명 키')."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$ME_KEYSTORE_PASSWORD" > /dev/null \
            || { echo "::error::서명 키를 열 수 없습니다. ME_KEYSTORE_BASE64와 ME_KEYSTORE_PASSWORD를 확인하세요."; exit 1; }
          echo "ME_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          ME_KEYSTORE_PASSWORD: ${{ secrets.ME_KEYSTORE_PASSWORD }}
          ME_KEY_ALIAS: ${{ secrets.ME_KEY_ALIAS }}
          ME_KEY_PASSWORD: ${{ secrets.ME_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease assembleDebug bundleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/monster-expedition.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/monster-expedition-debug.apk
          TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          "${TOOLS}aapt" dump badging dist/monster-expedition.apk | head -3
          "${TOOLS}apksigner" verify --print-certs dist/monster-expedition.apk | grep -E 'DN|SHA-256'
          cp android/app/build/outputs/bundle/release/app-release.aab dist/monster-expedition.aab

      # AAB(Android App Bundle): 플레이 스토어에 올리는 파일. 형식 검사 + 서명·targetSdk·버전 확인
      - name: Check AAB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo google/bundletool --pattern 'bundletool-all-*.jar' --output "$RUNNER_TEMP/bundletool.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle dist/monster-expedition.aab > /dev/null
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle dist/monster-expedition.aab > "$RUNNER_TEMP/aab-manifest.xml"
          grep -oE '(versionCode|versionName|minSdkVersion|targetSdkVersion)="[^"]*"' "$RUNNER_TEMP/aab-manifest.xml"
          grep -q 'targetSdkVersion="36"' "$RUNNER_TEMP/aab-manifest.xml" || { echo "::error::AAB targetSdk가 36이 아닙니다."; exit 1; }
          if grep -q 'android.permission.' "$RUNNER_TEMP/aab-manifest.xml"; then
            echo "::error::권한이 추가되었습니다. 개인정보처리방침(privacy.html)·데이터 보안 답변을 함께 고치세요."
            grep -o 'android.permission.[A-Z_]*' "$RUNNER_TEMP/aab-manifest.xml"; exit 1
          fi
          jarsigner -verify dist/monster-expedition.aab | tail -1
          keytool -printcert -jarfile dist/monster-expedition.aab | grep -E 'Owner|SHA256'

      - uses: actions/upload-artifact@v4
        with:
          name: monster-expedition-apk
          path: dist/monster-expedition.apk

      - uses: actions/upload-artifact@v4
        with:
          name: monster-expedition-debug-apk
          path: dist/monster-expedition-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: monster-expedition-aab
          path: dist/monster-expedition.aab

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 31 # Android 12
          - api-level: 33 # Android 13
          - api-level: 34 # Android 14
          - api-level: 35 # Android 15
          - api-level: 36 # Android 16
    name: emulator-test (API ${{ matrix.api-level }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: monster-expedition-*apk
          path: dist
          merge-multiple: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install websocket-client

      # 시스템 이미지 내려받기가 가끔 실패해서(ZipFile unknown archive) 미리 받아 둔다(최대 3번)
      - name: Download system image
        run: |
          DIR="$ANDROID_HOME/system-images/android-${{ matrix.api-level }}/google_apis/x86_64"
          for i in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "system-images;android-${{ matrix.api-level }};google_apis;x86_64" > /dev/null || true
            [ -f "$DIR/source.properties" ] && break
            echo "retry $i"; sleep 10
          done

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python android/ci/emulator_test.py ${{ matrix.api-level }} dist/monster-expedition.apk dist/monster-expedition-debug.apk test-output

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-api${{ matrix.api-level }}
          path: test-output

  release:
    needs: [build, emulator-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: monster-expedition-{apk,aab}
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 몬스터 원정대 APK ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/monster-expedition.apk
            dist/monster-expedition.aab
          body: |
            안드로이드 휴대폰에서 아래 **monster-expedition.apk**를 내려받아 설치하세요.
            (처음 설치할 때 "출처를 알 수 없는 앱 설치" 허용이 필요할 수 있어요.)

            - 지원: Android 7.0 이상 (Android 12 · 13 · 14 · 15 · 16 에뮬레이터 테스트 통과)
            - **monster-expedition.aab**는 플레이 스토어(Play Console) 업로드용 파일입니다. 휴대폰에는 APK를 설치하세요.
            - 이전 버전이 깔려 있으면 지우지 말고 그대로 덮어 설치하면 리포트(세이브)가 유지됩니다.
              (apk-13 이하는 예전 공용 키로 서명돼 있어서, 그 버전이 깔려 있으면 저장 코드로 리포트를 옮긴 뒤 지우고 설치하세요.)
            - 커밋: ${{ github.sha }}

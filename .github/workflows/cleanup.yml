# 한 번만 쓰는 정리: v1.0.0 이전 릴리스·태그와 Actions 실행 기록을 지운다
#  - keep 태그(기본 v1.0.0)가 있는 릴리스로 올라와 있어야 실행한다
#  - 지우는 것: "v"로 시작하지 않는 릴리스와 태그(veloria-·godot-·apk-), keep 릴리스를 만든 빌드보다 먼저 시작한 모든 실행 기록
#  - 되돌릴 수 없으므로 confirm에 DELETE를 적어야 동작한다
name: Cleanup

on:
  workflow_dispatch:
    inputs:
      keep:
        description: '남길 첫 릴리스 태그'
        required: true
        default: 'v1.0.0'
      confirm:
        description: '되돌릴 수 없습니다. 진행하려면 DELETE'
        required: true
        default: ''

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'DELETE'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
      KEEP: ${{ inputs.keep }}
    steps:
      - name: 남길 릴리스와 그 빌드 찾기
        run: |
          gh release view "$KEEP" --repo "$R" --json tagName,isDraft --jq '.tagName' | grep -qx "$KEEP"
          SHA=$(gh api "repos/$R/commits/$KEEP" --jq .sha)
          RUN=$(gh api "repos/$R/actions/workflows/godot.yml/runs?head_sha=$SHA&event=push" --jq '[.workflow_runs[] | select(.conclusion == "success")][0] | "\(.id) \(.created_at)"')
          [ -n "$RUN" ] && [ "$RUN" != "null" ] || { echo "::error::$KEEP 을 만든 빌드를 찾지 못함"; exit 1; }
          echo "남길 빌드: $RUN ($SHA)"
          echo "KEEP_AT=${RUN#* }" >> "$GITHUB_ENV"

      - name: 이전 릴리스·태그 지우기
        run: |
          gh api "repos/$R/releases?per_page=100" --paginate --jq '.[].tag_name' | grep -v '^v' | while read -r t; do
            echo "릴리스 삭제: $t"
            gh release delete "$t" --repo "$R" --cleanup-tag -y
          done
          gh api "repos/$R/git/matching-refs/tags" --paginate --jq '.[].ref' | sed 's#^refs/tags/##' | grep -v '^v' | while read -r t; do
            echo "태그 삭제: $t"
            gh api -X DELETE "repos/$R/git/refs/tags/$t"
          done
          echo "### 남은 릴리스" >> "$GITHUB_STEP_SUMMARY"
          gh release list --repo "$R" --limit 50 | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

      - name: 이전 실행 기록 지우기
        run: |
          gh api "repos/$R/actions/runs?per_page=100" --paginate \
            --jq ".workflow_runs[] | select(.created_at < \"$KEEP_AT\" and .id != ${{ github.run_id }}) | .id" > old-runs.txt
          echo "지울 실행 기록 $(wc -l < old-runs.txt)개 (기준 $KEEP_AT 이전)"
          n=0
          while read -r id; do
            gh api -X DELETE "repos/$R/actions/runs/$id" --silent && n=$((n + 1)) || echo "::warning::$id 삭제 실패"
          done < old-runs.txt
          echo "### 실행 기록 $n개 삭제" >> "$GITHUB_STEP_SUMMARY"

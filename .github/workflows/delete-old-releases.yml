# 한 번만 쓰는 정리 작업: 예전 공용 키로 서명된 릴리스(apk-9, apk-13) 삭제. 실행한 뒤 이 파일은 지운다.
name: Delete old releases

on:
  push:
    branches: [claude/monster-expedition-apk-s582te]
    paths: ['.github/workflows/delete-old-releases.yml']

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete apk-9, apk-13 (tags are kept)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for tag in apk-9 apk-13; do
            gh release delete "$tag" --yes
          done
          gh release list
